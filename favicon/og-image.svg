<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgOg" cx="60%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#211B55"/>
      <stop offset="100%" stop-color="#16123A"/>
    </radialGradient>
    <linearGradient id="planeOg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6FFFC0"/>
      <stop offset="100%" stop-color="#1DD67A"/>
    </linearGradient>
    <filter id="glowOg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="goldGlowOg" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="barOg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5A4FC0"/>
      <stop offset="100%" stop-color="#39327E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgOg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.06" stroke="#A8A4D6" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- === ICON (left side, large) === -->
  <!-- Icon background rounded square -->
  <rect x="60" y="115" width="400" height="400" rx="80" fill="#1A1548" stroke="#38F29F" stroke-width="3" opacity="0.9"/>

  <!-- Bar chart -->
  <rect x="300" y="370" width="32" height="90" rx="4" fill="url(#barOg)"/>
  <rect x="342" y="335" width="32" height="125" rx="4" fill="url(#barOg)"/>
  <rect x="384" y="300" width="32" height="160" rx="4" fill="url(#barOg)"/>

  <!-- Trending arrow on icon -->
  <path d="M 120 460 Q 220 350 370 200" stroke="#38F29F" stroke-width="10" fill="none" stroke-linecap="round" filter="url(#glowOg)"/>
  <polygon points="370,200 340,208 352,236" fill="#38F29F" filter="url(#glowOg)"/>

  <!-- Explosion -->
  <g filter="url(#goldGlowOg)">
    <polygon points="195,370 203,340 218,368 238,346 230,376 260,372 238,392 250,424 218,406 210,436 193,406 168,420 176,390 148,386 173,370 165,340" fill="#FFD24A" opacity="0.9"/>
    <ellipse cx="210" cy="390" rx="22" ry="18" fill="#FFF0A0" opacity="0.85"/>
  </g>

  <!-- Plane on icon -->
  <g filter="url(#glowOg)" transform="rotate(-35, 240, 290) translate(100, 50)">
    <ellipse cx="140" cy="240" rx="75" ry="22" fill="url(#planeOg)"/>
    <path d="M 210 240 L 250 238 L 210 252 Z" fill="#38F29F"/>
    <path d="M 115 235 L 70 185 L 160 228 Z" fill="#38F29F"/>
    <path d="M 112 248 L 65 280 L 158 254 Z" fill="#2ECC8A"/>
    <path d="M 68 232 L 40 202 L 80 230 Z" fill="#38F29F"/>
    <path d="M 68 248 L 40 264 L 80 248 Z" fill="#2ECC8A"/>
  </g>

  <!-- Motion streaks -->
  <g opacity="0.6" transform="rotate(-35, 110, 330) translate(60, 60)">
    <line x1="50" y1="270" x2="90" y2="268" stroke="#38F29F" stroke-width="4" stroke-linecap="round"/>
    <line x1="42" y1="284" x2="86" y2="282" stroke="#38F29F" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="46" y1="298" x2="83" y2="296" stroke="#38F29F" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- === TEXT (right side) === -->
  <!-- BetCrash logotype -->
  <text x="520" y="290" font-family="'Space Grotesk', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="96" fill="#FFFFFF" letter-spacing="-2">Bet</text>
  <text x="700" y="290" font-family="'Space Grotesk', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="96" fill="#FFD24A" letter-spacing="-2">Crash</text>

  <!-- Tagline -->
  <text x="522" y="345" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-weight="400" font-size="28" fill="#A8A4D6" letter-spacing="1">Premium Crash Gaming</text>

  <!-- Decorative accent line -->
  <rect x="522" y="365" width="120" height="4" rx="2" fill="#38F29F" opacity="0.8"/>
</svg>
