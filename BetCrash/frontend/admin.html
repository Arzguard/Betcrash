<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BetCrash — Admin</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0E0C2B">
<!-- Set this to your deployed BetCrash backend URL in production -->
<meta name="betcrash-api-url" content="">
<link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #0E0C2B;
    --panel: #17144A;
    --panel-raised: #201C5C;
    --panel-line: #2C2870;
    --green: #33E28A;
    --green-dim: rgba(51,226,138,0.14);
    --yellow: #FFD23F;
    --yellow-dim: rgba(255,210,63,0.13);
    --red: #FF5C6C;
    --red-dim: rgba(255,92,108,0.14);
    --text-hi: #F5F4FF;
    --text-mid: #9C98CC;
    --text-low: #625E96;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(120% 140% at 100% -10%, #211D63 0%, var(--void) 55%);
    color:var(--text-hi); font-family:'Inter',sans-serif; min-height:100vh; display:flex;
  }
  ::selection{background:var(--yellow);color:var(--void);}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:4px;}

  /* ═══ SIM BANNER ═══ */

  /* ═══ ADMIN LOGIN GATE ═══ */
  .login-gate{
    position:fixed; inset:0; z-index:9500;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(120% 140% at 50% -10%, #211D63 0%, var(--void) 60%);
    padding:20px;
  }
  .login-card{
    width:min(92vw,400px); background:var(--panel); border:1px solid var(--panel-line);
    border-radius:18px; padding:30px 28px;
    box-shadow:0 28px 80px rgba(0,0,0,.45);
  }
  .login-card .brand{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
  .login-card h2{font-family:'Space Grotesk';font-size:21px;margin:0 0 6px;}
  .login-card .desc{font-size:13px;color:var(--text-mid);margin-bottom:20px;line-height:1.6;}
  .login-card label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-mid);font-weight:600;display:block;margin-bottom:8px;}
  .login-card .field{margin-bottom:14px;}
  .login-card input{
    width:100%;background:var(--void);border:1px solid var(--panel-line);border-radius:9px;
    padding:12px;color:var(--text-hi);font-family:'Inter';font-size:14px;outline:none;
  }
  .login-card input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(51,226,138,.15);}
  .login-card .hint{font-size:11.5px;color:var(--text-low);margin-top:6px;line-height:1.5;}
  .login-card .hint.err{color:var(--red);}
  .login-card .hint.ok{color:var(--green);}
  .login-card .btn{
    width:100%;padding:13px;border:none;border-radius:10px;margin-top:12px;
    font-family:'Space Grotesk';font-weight:700;font-size:14px;cursor:pointer;
    background:var(--green);color:#062616;
  }
  .login-card .btn:disabled{background:var(--panel-raised);color:var(--text-low);cursor:not-allowed;}
  .login-card .otp-row{display:flex;gap:8px;margin-bottom:8px;}
  .login-card .otp-row input{flex:1;text-align:center;font-family:'JetBrains Mono';font-size:20px;font-weight:700;padding:12px 0;min-width:0;}
  .demo-creds{
    margin-top:16px;padding:10px 12px;border-radius:9px;
    background:var(--yellow-dim);border:1px solid rgba(255,210,63,.35);
    font-size:11.5px;color:#FFE9B0;line-height:1.6;
  }
  .demo-creds b{color:#fff;}
  .demo-creds code{font-family:'JetBrains Mono';color:var(--yellow);}

  /* ═══ SIDEBAR ═══ */
  .sidebar{
    width:236px;flex:0 0 236px;
    background:rgba(23,20,74,0.6);
    border-right:1px solid var(--panel-line);
    display:flex;flex-direction:column;
    padding:18px 14px;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:0 6px 20px;}
  .brand-mark{
    width:28px;height:28px;border-radius:8px;
    background:conic-gradient(from 220deg, var(--green), var(--yellow), var(--green));
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk';font-weight:700;color:var(--void);font-size:14px;
  }
  .brand-name{font-family:'Space Grotesk';font-weight:700;font-size:15.5px;}
  .brand-name span{color:var(--yellow);}
  .brand-name small{color:var(--text-mid);font-weight:500;font-size:12px;}
  .role-pill{
    margin:0 6px 16px;padding:7px 10px;border-radius:9px;
    background:var(--panel);border:1px solid var(--panel-line);
    font-size:11px;color:var(--text-mid);display:flex;align-items:center;justify-content:space-between;
  }
  .role-pill b{color:var(--text-hi);font-weight:600;}
  .role-pill .badge{
    background:var(--green-dim);color:var(--green);padding:2px 7px;border-radius:99px;
    font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  }
  .role-switch{margin:0 6px 16px;}
  .role-switch select{
    width:100%;background:var(--panel);border:1px solid var(--panel-line);color:var(--text-hi);
    padding:8px 10px;border-radius:9px;font-size:12px;font-family:'Inter';
  }
  .nav-group{margin-bottom:14px;}
  .nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-low);padding:0 10px;margin-bottom:6px;font-weight:600;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;
    font-size:12.5px;color:var(--text-mid);cursor:pointer;font-weight:500;
    background:none;border:none;width:100%;text-align:left;
  }
  .nav-item:hover{color:var(--text-hi);background:var(--panel);}
  .nav-item.active{background:var(--panel-raised);color:var(--text-hi);}
  .nav-item .dot{width:6px;height:6px;border-radius:50%;background:var(--panel-line);flex:0 0 auto;}
  .nav-item.active .dot{background:var(--green);box-shadow:0 0 6px var(--green);}
  .nav-item .count{margin-left:auto;background:var(--red-dim);color:var(--red);font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;font-family:'JetBrains Mono';}
  .nav-item.locked{opacity:.45;cursor:not-allowed;}
  .sidebar-foot{margin-top:auto;padding:10px 6px 0;border-top:1px solid var(--panel-line);}
  .admin-chip{display:flex;align-items:center;gap:9px;padding-top:12px;}
  .admin-chip .av{width:30px;height:30px;border-radius:8px;background:var(--panel-raised);border:1px solid var(--panel-line);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--green);font-size:12px;}
  .admin-chip .who{font-size:12.5px;font-weight:600;}
  .admin-chip .role{font-size:10.5px;color:var(--text-mid);}
  .logout-btn{
    margin-top:10px;width:100%;padding:8px;border-radius:8px;cursor:pointer;
    background:transparent;border:1px solid var(--panel-line);color:var(--text-mid);font-size:12px;font-weight:600;
  }
  .logout-btn:hover{color:var(--red);border-color:var(--red);}

  /* ═══ MAIN ═══ */
  .main{flex:1;min-width:0;padding:20px 26px 60px;max-width:1500px;margin:0 auto;width:100%;}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .search-wrap{flex:1;min-width:220px;position:relative;max-width:420px;}
  .search-wrap input{
    width:100%;background:var(--panel);border:1px solid var(--panel-line);border-radius:10px;
    padding:10px 12px 10px 36px;color:var(--text-hi);font-size:13px;outline:none;
  }
  .search-wrap input:focus{border-color:var(--green);}
  .search-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-low);font-size:14px;pointer-events:none;}
  .top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .pill{
    display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--panel-line);
    padding:8px 13px;border-radius:99px;font-family:'JetBrains Mono';font-size:11.5px;color:var(--text-mid);
  }
  .pill .dot{width:6px;height:6px;border-radius:50%;}
  .pill .dot.green{background:var(--green);box-shadow:0 0 6px var(--green);}
  .pill .dot.yellow{background:var(--yellow);box-shadow:0 0 6px var(--yellow);}
  .bell-btn{
    position:relative;background:var(--panel);border:1px solid var(--panel-line);border-radius:10px;
    width:38px;height:38px;cursor:pointer;font-size:16px;color:var(--text-mid);
    display:flex;align-items:center;justify-content:center;
  }
  .bell-btn:hover{color:var(--text-hi);border-color:var(--green);}
  .bell-badge{
    position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;
    border-radius:99px;background:var(--red);color:#fff;font-size:10px;font-weight:700;
    font-family:'JetBrains Mono';align-items:center;justify-content:center;
    border:2px solid var(--void);box-shadow:0 2px 8px rgba(255,92,108,.5);
    display:none;
  }
  .bell-wrap{position:relative;}
  .bell-drop{
    position:absolute;right:0;top:48px;width:352px;max-width:88vw;
    background:var(--panel-raised);border:1px solid var(--panel-line);border-radius:14px;
    display:none;flex-direction:column;z-index:300;overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.55);
    opacity:0;transform:translateY(-6px);transition:opacity .18s ease,transform .18s ease;
  }
  .bell-drop.open{display:flex;opacity:1;transform:translateY(0);}
  .bell-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 14px;border-bottom:1px solid var(--panel-line);background:rgba(14,12,43,.35);
  }
  .bell-head .title{font-family:'Space Grotesk';font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px;}
  .bell-head .count{
    font-size:10px;font-family:'JetBrains Mono';font-weight:700;color:var(--yellow);
    background:var(--yellow-dim);border:1px solid rgba(255,210,63,.35);
    padding:1px 7px;border-radius:99px;
  }
  .bell-head .mark-read{
    background:none;border:none;color:var(--text-mid);font-size:11px;cursor:pointer;font-weight:600;
    padding:4px 6px;border-radius:6px;
  }
  .bell-head .mark-read:hover{color:var(--green);background:var(--panel);}
  .bell-body{max-height:min(380px,52vh);overflow-y:auto;padding:6px;}
  .bell-body::-webkit-scrollbar{width:6px;}
  .bell-body::-webkit-scrollbar-thumb{background:var(--panel-line);border-radius:99px;}
  .notif-item{
    display:flex;gap:11px;padding:10px;border-radius:10px;cursor:pointer;position:relative;
    transition:background .12s ease;
  }
  .notif-item:hover{background:var(--panel);}
  .notif-item.unread{background:rgba(51,226,138,.05);}
  .notif-item.unread::before{
    content:'';position:absolute;left:3px;top:50%;transform:translateY(-50%);
    width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);
  }
  .notif-ico{
    width:32px;height:32px;border-radius:9px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:14px;
  }
  .notif-ico.finance{background:var(--yellow-dim);}
  .notif-ico.security{background:var(--red-dim);}
  .notif-ico.user{background:var(--green-dim);}
  .notif-ico.system{background:var(--panel);border:1px solid var(--panel-line);}
  .notif-main{min-width:0;flex:1;}
  .notif-title{font-size:12.5px;font-weight:600;line-height:1.35;}
  .notif-text{font-size:11.5px;color:var(--text-mid);margin-top:2px;line-height:1.45;}
  .notif-time{font-size:10px;color:var(--text-low);font-family:'JetBrains Mono';margin-top:4px;}
  .notif-item.read .notif-title{color:var(--text-mid);font-weight:500;}
  .bell-foot{
    padding:9px 14px;border-top:1px solid var(--panel-line);text-align:center;
    font-size:11px;color:var(--text-low);background:rgba(14,12,43,.35);
  }
  .bell-empty{padding:26px 16px;text-align:center;color:var(--text-low);font-size:12.5px;line-height:1.6;}
  .bell-empty .big{font-size:22px;display:block;margin-bottom:8px;}
  .btn-primary{
    background:var(--yellow);color:#3B2900;border:none;padding:9px 16px;border-radius:9px;
    font-family:'Space Grotesk';font-weight:700;font-size:12.5px;cursor:pointer;
  }
  .btn-primary:hover{filter:brightness(1.07);}

  /* Bots quick-toggle pill / button (top bar + dashboard panel) */
  .bots-pill{
    cursor:pointer;user-select:none;font-family:'Space Grotesk';font-weight:700;font-size:11.5px;
    transition:border-color .15s,color .15s;
  }
  .bots-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--text-low);}
  .bots-pill:hover{border-color:var(--yellow);color:var(--text-hi);}
  .bots-pill.on{color:var(--green);border-color:rgba(51,226,138,.4);}
  .bots-pill.on .dot{background:var(--green);box-shadow:0 0 6px var(--green);}
  .bots-pill.off{color:var(--text-mid);border-color:var(--panel-line);}

  /* Toggle switch (settings) */
  .switch{position:relative;display:inline-block;width:52px;height:30px;flex:0 0 auto;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{
    position:absolute;inset:0;background:var(--panel-raised);border:1px solid var(--panel-line);
    border-radius:99px;cursor:pointer;transition:background .2s,border-color .2s;
  }
  .slider::before{
    content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;
    background:var(--text-mid);transition:transform .2s,background .2s;
  }
  .switch input:checked + .slider{background:var(--green-dim);border-color:rgba(51,226,138,.4);}
  .switch input:checked + .slider::before{transform:translateX(22px);background:var(--green);}

  .topline{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .topline h1{font-family:'Space Grotesk';font-size:21px;margin:0;font-weight:700;}
  .topline .sub{font-size:12.5px;color:var(--text-mid);margin-top:3px;}

  .demo-chip{
    display:inline-flex;align-items:center;gap:6px;
    font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    color:var(--yellow);background:var(--yellow-dim);border:1px solid rgba(255,210,63,.4);
    padding:2px 8px;border-radius:99px;font-family:'JetBrains Mono';
  }

  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;}
  @media (max-width:1100px){ .stat-grid{grid-template-columns:repeat(2,1fr);} }
  .stat-card{
    background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:16px;position:relative;overflow:hidden;
  }
  .stat-card .label{font-size:11px;color:var(--text-mid);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
  .stat-card .value{font-family:'Space Grotesk';font-size:26px;font-weight:700;margin-top:8px;}
  .stat-card .delta{font-family:'JetBrains Mono';font-size:11.5px;margin-top:6px;display:flex;align-items:center;gap:5px;}
  .delta.up{color:var(--green);}
  .delta.down{color:var(--red);}
  .stat-card.accent-green{border-color:rgba(51,226,138,0.35);}
  .stat-card.accent-yellow{border-color:rgba(255,210,63,0.35);}
  .stat-card.accent-red{border-color:rgba(255,92,108,0.35);}

  .content-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:14px;}
  @media (max-width:1100px){ .content-grid{grid-template-columns:1fr;} }
  .panel{background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:18px;margin-bottom:14px;}
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;
  }
  .panel-head h3{font-family:'Space Grotesk';font-size:14.5px;margin:0;font-weight:700;}
  .panel-head .right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .panel-head .tabs{display:flex;gap:6px;}
  .panel-head .tabs button{
    background:var(--panel-raised);border:1px solid var(--panel-line);color:var(--text-mid);
    font-size:11px;padding:5px 10px;border-radius:7px;cursor:pointer;font-family:'JetBrains Mono';
  }
  .panel-head .tabs button.active{color:var(--text-hi);border-color:var(--green);}

  .round-row{
    display:grid;grid-template-columns:70px 1fr 90px 90px 80px;align-items:center;gap:8px;
    padding:9px 0;border-bottom:1px solid var(--panel-line);font-family:'JetBrains Mono';font-size:12px;
  }
  .round-row:last-child{border-bottom:none;}
  .round-row.head{color:var(--text-low);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;}
  .round-row .bar-wrap{background:var(--void);border-radius:5px;height:6px;overflow:hidden;}
  .round-row .bar{height:100%;background:var(--green);}
  .round-row .mult{font-weight:700;}
  .round-row .mult.crashed{color:var(--red);}
  .round-row .mult.live{color:var(--green);}
  .status-badge{font-size:10px;padding:2px 8px;border-radius:99px;font-weight:700;text-align:center;}
  .status-badge.live{background:var(--green-dim);color:var(--green);}
  .status-badge.crashed{background:var(--red-dim);color:var(--red);}
  .status-badge.pending{background:var(--yellow-dim);color:var(--yellow);}

  .log-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--panel-line);align-items:flex-start;}
  .log-row:last-child{border-bottom:none;}
  .log-dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex:0 0 auto;}
  .log-dot.finance{background:var(--yellow);}
  .log-dot.security{background:var(--red);}
  .log-dot.user{background:var(--green);}
  .log-dot.system{background:var(--text-mid);}
  .log-body{font-size:12.5px;line-height:1.4;}
  .log-time{font-size:10.5px;color:var(--text-low);margin-top:2px;font-family:'JetBrains Mono';}

  .table{width:100%;border-collapse:collapse;}
  .table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-low);padding:0 10px 8px;font-weight:600;}
  .table td{padding:10px;font-size:12.5px;border-top:1px solid var(--panel-line);}
  .table tr td:first-child,.table th:first-child{padding-left:14px;}
  .table .user-cell{display:flex;align-items:center;gap:9px;}
  .table .av-sm{width:26px;height:26px;border-radius:7px;background:var(--panel-raised);border:1px solid var(--panel-line);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--text-mid);}
  .table .amt{font-family:'JetBrains Mono';font-weight:700;}
  .table .amt.out{color:var(--yellow);}
  .table .amt.in{color:var(--green);}
  .row-actions{display:flex;gap:6px;}
  .row-actions button{
    border:1px solid var(--panel-line);background:var(--panel-raised);color:var(--text-mid);
    font-size:11px;padding:5px 10px;border-radius:7px;cursor:pointer;font-family:'Space Grotesk';font-weight:600;
  }
  .row-actions button:hover{color:var(--text-hi);}
  .row-actions button.approve{color:var(--green);border-color:rgba(51,226,138,0.35);}
  .row-actions button.deny{color:var(--red);border-color:rgba(255,92,108,0.35);}
  .risk-flag{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:700;}
  .risk-flag.low{background:var(--green-dim);color:var(--green);}
  .risk-flag.med{background:var(--yellow-dim);color:var(--yellow);}
  .risk-flag.high{background:var(--red-dim);color:var(--red);}

  /* Permissions view — role templates & custom picker */
  .perm-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px;}
  .role-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
  .role-card{background:var(--panel-raised);border:1px solid var(--panel-line);border-radius:14px;padding:14px 16px;transition:border-color .15s,transform .15s;}
  .role-card:hover{border-color:rgba(51,226,138,.35);transform:translateY(-1px);}
  .role-card .rc-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .role-card .rc-name{font-family:'Space Grotesk';font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;}
  .role-card .rc-name .rc-crown{font-size:12px;}

function deviceInfo(){
  const ua = (navigator.userAgent || '');
  let os = 'Unknown';
  if(/Windows/.test(ua)) os = 'Windows';
  else if(/Android/.test(ua)) os = 'Android';
  else if(/iPhone|iPad/.test(ua)) os = 'iOS';
  else if(/Mac/.test(ua)) os = 'macOS';
  else if(/Linux/.test(ua)) os = 'Linux';
  let browser = 'Unknown';
  if(/Edg\//.test(ua)) browser = 'Edge';
  else if(/Chrome\//.test(ua)) browser = 'Chrome';
  else if(/Firefox\//.test(ua)) browser = 'Firefox';
  else if(/Safari\//.test(ua)) browser = 'Safari';
  return { browser, os };
}
function deviceId(){
  const d = deviceInfo();
  const fp = [d.browser, d.os, (navigator.language||''), (screen.width||'')].join('|');
  return fp; // demo fingerprint; server computes a real one in production
}

function renderPermChips(staffId){
  const box = document.getElementById('customPerms');
  if(!box) return;
  const staff = demoStaff.find(s => s.id === staffId);
  if(!staff) return;
  const template = ROLE_TEMPLATES[staff.role] || [];
  const custom = staff.custom || [];
  const sum = document.getElementById('permSummary');
  if(sum){
    sum.innerHTML = '<b>' + template.length + '</b> template · <b style="color:var(--yellow);">' + custom.length + '</b> custom';
  }
  box.innerHTML = PERM_GROUPS.map(g => {
    const chips = g.perms.map(p => {
      const inTemplate = template.includes(p);
      const on = inTemplate || custom.includes(p);
      const cls = inTemplate ? 'perm-toggle locked' : ('perm-toggle' + (on ? ' on' : ''));
      const icon = inTemplate ? '<span class="pt-lock">🔒</span>' : '<span class="pt-dot"></span>';
      return `<label class="${cls}" ${inTemplate ? 'title="From the ' + esc(ROLES[staff.role] ? ROLES[staff.role].label : staff.role) + ' template" data-tpl="1"' : ''}>
        <input type="checkbox" data-perm="${p}" ${on ? 'checked' : ''} ${inTemplate ? 'disabled' : ''}>${icon}${esc(p)}
      </label>`;
    }).join('');
    return `<div class="perm-group"><div class="pg-head">${esc(g.label)}</div><div class="pg-chips">${chips}</div></div>`;
  }).join('');
  box.querySelectorAll('input[data-perm]:not(:disabled)').forEach(cb => {
    cb.addEventListener('change', () => {

      staff.custom = staff.custom || [];

      renderPermChips(staffId);

  });

/* ═══════════════════════════════════════════════
   AUTH GATE — admin login with 2FA
   Live contract: POST /admin/login { username, password }
   → { challengeId } (OTP SMS/authenticator) then
   POST /admin/login/verify { challengeId, code } → { token, role, name }.
   Demo: admin / betcrash2026 / OTP 482913 — clearly sample.
═══════════════════════════════════════════════ */
let loginStep = 'creds'; // creds | otp
let loginChallenge = null;
let pendingAdminCode = null;
function renderLogin(){
  const body = document.getElementById('loginBody');
  const gate = document.getElementById('loginGate');
  gate.style.display = 'flex';
  if(loginStep === 'creds'){
    body.innerHTML = `
      <h2>Admin sign in</h2>
      <div class="desc">Restricted area — authorised BetCrash staff only. Two-step verification is required.</div>
      <div class="field"><label for="aUser">Username</label><input id="aUser" autocomplete="username" placeholder="e.g. nkariuki"></div>
      <div class="field"><label for="aPass">Password</label><input id="aPass" type="password" autocomplete="current-password" placeholder="Enter your password"></div>
      <div class="hint" id="loginHint"></div>
      <button class="btn" id="loginBtn2">Continue</button>
      ${SIM_MODE ? '<div class="demo-creds">Demo credentials — <code>admin</code> / <code>betcrash2026</code>, then OTP <code>482913</code>. No real access.</div>' : ''}
    `;
    document.getElementById('loginBtn2').addEventListener('click', doCreds);
    document.getElementById('aPass').addEventListener('keydown', e => { if(e.key === 'Enter') doCreds(); });
    document.getElementById('aUser').focus();
  } else {
    body.innerHTML = `
      <h2>Two-step verification</h2>
      <div class="desc">For your security, a 6-digit code was sent to your registered device${SIM_MODE ? ' (demo code: <b style="color:var(--yellow)">482913</b>)' : (pendingAdminCode ? ' (dev demo code: <b style="color:var(--yellow)">' + pendingAdminCode + '</b>)' : '')}.</div>
      <div class="otp-row">
        ${[0,1,2,3,4,5].map(i=>`<input maxlength="1" inputmode="numeric" class="otpDigit" data-i="${i}" aria-label="Digit ${i+1}">`).join('')}
      </div>
      <div class="hint" id="otpHint"></div>
      <button class="btn" id="otpBtn" disabled>Verify &amp; sign in</button>
    `;
    const digits = [...document.querySelectorAll('.otpDigit')];
    digits[0].focus();
    digits.forEach((d,i)=>{
      d.addEventListener('input', ()=>{
        d.value = d.value.replace(/[^0-9]/g,'');
        if(d.value && i<5) digits[i+1].focus();
        document.getElementById('otpBtn').disabled = digits.map(x=>x.value).join('').length !== 6;
      });
      d.addEventListener('keydown', e=>{ if(e.key==='Backspace' && !d.value && i>0) digits[i-1].focus(); });
    });
    document.getElementById('otpBtn').addEventListener('click', doOtp);
  }
}
async function doCreds(){
  const hint = document.getElementById('loginHint');
  const btn  = document.getElementById('loginBtn2');
  const user = document.getElementById('aUser').value.trim();
  const pass = document.getElementById('aPass').value;
  if(!user || !pass){ hint.className='hint err'; hint.textContent='Enter your username and password.'; return; }
  btn.disabled = true;
  btn.textContent = 'Checking…';
  if(SIM_MODE){
    await new Promise(r => setTimeout(r, 600));
    if(user === DEMO_ADMIN.username && pass === DEMO_ADMIN.password){
      loginChallenge = 'demo-challenge-' + Date.now();
      loginStep = 'otp';
      renderLogin();
    } else {
      btn.disabled = false; btn.textContent = 'Continue';
      hint.className='hint err'; hint.textContent='Invalid credentials. (Demo: admin / betcrash2026)';
      logAudit('security', 'Failed admin login attempt (demo)');
    }
    return;
  }
  try {
    const r = await fetchJson(`${API_BASE}/admin/login`, { method:'POST', body: JSON.stringify({ username: user, password: pass }) }, false);
    loginChallenge = r.challengeId;
    if(r.demoCode){ pendingAdminCode = r.demoCode; showToast('📲 Demo OTP: ' + r.demoCode + ' — expires in 5 min'); }
    loginStep = 'otp';
    renderLogin();
  } catch(err){
    btn.disabled = false; btn.textContent = 'Continue';
    hint.className='hint err'; hint.textContent = err.message || 'Login failed.';
  }
}
async function doOtp(){
  const hint = document.getElementById('otpHint');
  const btn  = document.getElementById('otpBtn');
  const code = [...document.querySelectorAll('.otpDigit')].map(d=>d.value).join('');
  btn.disabled = true; btn.textContent = 'Verifying…';
  if(SIM_MODE){
    await new Promise(r => setTimeout(r, 600));
    if(code !== '482913'){
      btn.disabled = false; btn.textContent = 'Verify & sign in';
      hint.className='hint err'; hint.textContent='Incorrect code — try 482913 (demo).';
      return;
    }
    enterApp({ name:'N. Kariuki', role:'superadmin' });
    return;
  }
  try {
    const r = await fetchJson(`${API_BASE}/admin/login/verify`, { method:'POST', body: JSON.stringify({ challengeId: loginChallenge, code }) }, false);
    enterApp({ name: r.name, role: r.role, token: r.token });
  } catch(err){
    btn.disabled = false; btn.textContent = 'Verify & sign in';
    hint.className='hint err'; hint.textContent = err.message || 'Incorrect or expired code.';
  }
}
function enterApp(admin){
  session = { name: admin.name, role: admin.role || 'superadmin' };
  safeSet('betcrashAdminSession', JSON.stringify(session));
  document.getElementById('loginGate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  const initials = session.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const roleLabel = ROLES[session.role]?.label || session.role;
  document.getElementById('adminName').textContent = session.name;
  document.getElementById('adminRole').textContent = roleLabel;
  document.getElementById('whoAmI').textContent = roleLabel;
  document.getElementById('adminAv').textContent = initials;
  document.getElementById('mtAvatar').textContent = initials;
  document.getElementById('drawerAdminAv').textContent = initials;
  document.getElementById('drawerAdminName').textContent = session.name;
  document.getElementById('drawerAdminRole').textContent = roleLabel;
  document.getElementById('roleSelect').value = session.role;
  document.getElementById('drawerRoleSelect').value = session.role;
  recordSession('ADM', session.name, roleLabel); // IAM: device/browser/OS/IP session log
  buildNav();
  go('dashboard');
  logAudit('security', 'Admin <b>' + esc(session.name) + '</b> signed in (demo)');
  renderActivity();
}
function logout(){
  closeDrawer();
  safeRemove('betcrashAdminSession');
  session = null;
  loginStep = 'creds';
  document.getElementById('app').style.display = 'none';
  renderLogin();
}

function buildNav(){
  const containers = [document.getElementById('nav'), document.getElementById('drawerNav')];
  const role = session.role;
  containers.forEach(nav => {
    if(!nav) return;
    nav.innerHTML = '';
    NAV.forEach(g => {

      const group = document.createElement('div');
      group.className = 'nav-group';
      group.innerHTML = `<div class="nav-label">${esc(g.group)}</div>`;
      items.forEach(i => {
        const b = document.createElement('button');
        b.className = 'nav-item' + (currentView === i.id ? ' active' : '');

function setBannerHidden(/* hidden */){ /* sim banner removed */ }
function openDrawer(){
  const dr = document.getElementById('drawer');
  if(dr) dr.classList.add('open');
  const sc = document.getElementById('drawerScrim');
  if(sc) sc.classList.add('show');
  const hb = document.getElementById('hamburger');
  if(hb) hb.setAttribute('aria-expanded', 'true');
  document.body.classList.add('drawer-locked');
  setBannerHidden(true); // keep the sim banner from covering the drawer's Log out
}
function closeDrawer(){
  const dr = document.getElementById('drawer');
  if(dr) dr.classList.remove('open');
  const sc = document.getElementById('drawerScrim');
  if(sc) sc.classList.remove('show');
  const hb = document.getElementById('hamburger');
  if(hb) hb.setAttribute('aria-expanded', 'false');
  document.body.classList.remove('drawer-locked');
  setBannerHidden(false);
}
function toggleDrawer(){
  const dr = document.getElementById('drawer');
  if(dr && dr.classList.contains('open')) closeDrawer();

}
function go(view){
  // Close the mobile drawer when a view is chosen
  closeDrawer();
  const allowed = ROLES[session.role].views;
  if(!allowed.includes(view)){ showToast('Not permitted for your role (RBAC demo)'); return; }
  currentView = view;
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.view === view);
    n.setAttribute('aria-current', n.dataset.view === view ? 'page' : 'false');
  });
  document.getElementById('viewTitle').textContent = TITLES[view] || view;
  document.getElementById('viewSub').textContent = todayLine();
  renderView(view);
}

    const raw = sharedGet('betcrashRoundState');
    return raw ? JSON.parse(raw) : null;
  } catch(_){ return null; }
}
function fmtMult(x){

function renderLive(){
  const st = readRoundState();
  const hint = document.getElementById('liveHint');
  if(!st){ if(hint) hint.style.display = 'block'; return; }
  if(hint) hint.style.display = 'none';
  const set = (id, v) => { const el = document.getElementById(id); if(el) el.textContent = v; };
  set('liveRoundId', '#' + st.roundId);
  // Next odds: previewed in the admin whenever the source discloses it
  // (simulation engine, or the demo backend while the round waits). If it's
  // absent (true production provable fairness), show the seed commitment.
  if(st.nextCrash != null){
    set('liveNextMult', fmtMult(st.nextCrash));
  } else if(st.live){
    set('liveNextMult', st.serverSeedHash ? '🔒 ' + st.serverSeedHash.slice(0, 10) + '…' : '—');
  } else {
    set('liveNextMult', fmtMult(st.nextCrash));
  }
  set('liveMult', fmtMult(st.mult));
  set('livePlayers', 'players: ' + (st.players ?? '—'));
  const status = document.getElementById('liveStatus');
  if(status){
    const map = { waiting:['Waiting','pending'], flying:['Flying','live'], crashed:['Crashed','crashed'] };
    const [txt, cls] = map[st.phase] || ['—','pending'];
    status.textContent = txt;
    status.className = 'status-badge ' + cls;
  }
  const cd = document.getElementById('liveCountdown');
  if(cd){
    if(st.phase === 'waiting' && st.waitEndsAt){
      const left = Math.max(0, Math.round((st.waitEndsAt - Date.now()) / 100) / 10);
      cd.textContent = 'lift-off in ' + left.toFixed(1) + 's';
    } else if(st.phase === 'flying') cd.textContent = 'round in progress';
    else if(st.phase === 'crashed') cd.textContent = 'crashed at ' + fmtMult(st.crash) + ' · next round soon';
    else cd.textContent = '—';
  }
  // Round sequence: last crashed → current → upcoming, in order
  const seq = document.getElementById('sequenceList');
  if(seq){
    const rows = [];
    const up = Array.isArray(st.upcoming) ? st.upcoming : [];
    // current round first
    rows.push(`
      <div class="seq-row cur">
        <div class="seq-idx">NOW</div>
        <div class="rid">#${st.roundId}</div>
        <div style="color:var(--text-mid);font-size:11px;">${st.phase === 'waiting' ? 'waiting' : st.phase === 'flying' ? 'flying @ ' + fmtMult(st.mult) : 'crashed'}</div>
        <div class="mult">${fmtMult(st.phase === 'crashed' ? st.crash : st.nextCrash)}</div>
      </div>`);
    // upcoming in order (simulation engine) — plus a NEXT row in live-demo
    if(st.live && st.nextCrash != null){
      rows.push(`
        <div class="seq-row up">
          <div class="seq-idx">NEXT</div>
          <div class="rid">#${st.roundId + 1}</div>
          <div style="color:var(--text-low);font-size:11px;">up next</div>
          <div class="mult">${fmtMult(st.nextCrash)}</div>
        </div>`);
    } else if(st.live){
      seq.innerHTML += '<div class="log-row" style="border:none;"><div style="font-size:11.5px;color:var(--text-low);line-height:1.6;">Live mode: each round\u2019s crash point is committed via its seed hash and revealed at crash (provable fairness). The sequence of future rounds is not visible to anyone \u2014 including admins.</div></div>';
    }
    up.slice(0, 10).forEach((q, i) => {
      rows.push(`
        <div class="seq-row up">
          <div class="seq-idx">${i + 1}</div>
          <div class="rid">#${q.id}</div>
          <div style="color:var(--text-low);font-size:11px;">up next</div>
          <div class="mult">${fmtMult(q.crash)}</div>
        </div>`);
    });
    seq.innerHTML = rows.join('');
    const seqStatus = document.getElementById('seqStatus');
    if(seqStatus){
      if(st.phase === 'crashed'){ seqStatus.textContent = 'next round soon'; seqStatus.className = 'status-badge crashed'; }
      else if(st.phase === 'flying'){ seqStatus.textContent = 'round in progress'; seqStatus.className = 'status-badge live'; }
      else { seqStatus.textContent = 'following live'; seqStatus.className = 'status-badge pending'; }
    }
  }

  const der = document.getElementById('liveDerivation');
  if(der){
    if(st.phase === 'waiting' && st.nextCrash){
      if(st.r !== null && st.r !== undefined){
        der.innerHTML = 'draw r = <b style="color:var(--text-hi);">' + st.r.toFixed(6) + '</b><br>0.97 / (1 − ' + st.r.toFixed(6) + ') = <b style="color:var(--text-hi);">' + (0.97 / (1 - st.r)).toFixed(4) + '</b> → clamped → <b style="color:var(--green);">' + st.nextCrash.toFixed(2) + 'x</b>';
      } else {
        der.innerHTML = '← set by <b style="color:var(--yellow);">admin override</b> (no random draw for this round)';
      }
    } else if(st.phase === 'crashed' && st.crash){
      der.innerHTML = 'last round crashed at <b style="color:var(--red);">' + st.crash.toFixed(2) + 'x</b> — the next draw is generated when the next round starts.';
    } else {
      der.innerHTML = 'The random draw happens when the next round starts.';
    }
  }
}

function updateOddsStrip(){

    next.textContent = '—';

  const c = document.getElementById('stripCount'); if(!c) return;

    const left = Math.max(0, Math.round((st.waitEndsAt - Date.now()) / 100) / 10);
    c.textContent = '· lift-off in ' + left.toFixed(1) + 's';

  else if(st.phase === 'crashed') c.textContent = '· crashed — next round soon';
  else c.textContent = '';
}

/* ═══════════════════════════════════════════════
   OTP INBOX — like an SMS gateway dashboard (demo)
   Every OTP requested anywhere (register, login, withdrawal, password
   reset) lands here in the shared inbox with its code, purpose and
   destination. In live mode this screen would show the real SMS gateway
   log instead — never the codes themselves.
═══════════════════════════════════════════════ */
function getOtpPolicy(){
  try {
    const p = JSON.parse(sharedGet('betcrashOtpPolicy') || 'null');
    if(p && p.expirySec) return p;
  } catch(_){}
  return { expirySec: 300, cooldownSec: 60, maxAttempts: 5, dailyLimit: 10, senderId: 'BetCrash', provider: 'demo-console' };
}
function otpInboxList(){
  try { return JSON.parse(sharedGet('betcrashOtpInbox') || '[]'); } catch(_){ return []; }
}
function otpInboxStore(list){ sharedSet('betcrashOtpInbox', JSON.stringify(list.slice(-20))); }
function genOtpCode(){
  if(window.crypto && typeof window.crypto.getRandomValues === 'function'){
    const b = new Uint32Array(1);
    window.crypto.getRandomValues(b);
    return String(b[0] % 1000000).padStart(6, '0');
  }
  return String(Math.floor(Math.random() * 1000000)).padStart(6, '0');
}
function viewOtpInbox(){
  return `
  <div class="panel">
    <div class="panel-head">

      <div class="stat-card accent-red"><div class="label">Failed / blocked</div><div class="value" style="font-size:20px;" id="smsFailed">0</div></div>

    <div style="font-size:12px;color:var(--text-mid);margin-bottom:12px;line-height:1.6;">Every code requested on the main site (registration, login, withdrawals, password reset) appears here in real time — exactly like reading the SMS gateway. Policies (expiry, cooldown, attempts, daily limit) are configurable in <b>Settings</b> and apply immediately.</div>
    <table class="table">
      <thead><tr><th>Code</th><th>Purpose</th><th>Destination</th><th>Created</th><th>Expires</th><th>Attempts</th><th>Status</th></tr></thead>

    <div style="font-size:11px;color:var(--text-low);margin-top:10px;">Simulation of GET /api/v1/sms/status. In live mode the real SMS-IVS service replaces this screen — codes are hashed server-side and never shown to staff, only send logs and delivery metrics.</div>
  </div>`;
}
function renderSmsMetrics(){
  const set = (id, v) => { const el = document.getElementById(id); if(el) el.textContent = v; };
  const pol = getOtpPolicy();
  set('smsProvider', pol.provider || 'demo-console');
  set('smsSender', pol.senderId || 'BetCrash');
  const list = otpInboxList();
  const today = new Date().toISOString().slice(0, 10);
  const todays = list.filter(o => o.day === today);
  set('smsSent', todays.length);
  set('smsVerified', todays.filter(o => o.used).length);
  set('smsFailed', todays.filter(o => o.locked || (o.expiresAt <= Date.now() && !o.used)).length);
}
function renderOtpInbox(){
  const body = document.getElementById('otpBody');
  if(!body) return;
  const list = otpInboxList().slice().reverse(); // newest first
  if(!list.length){
    body.innerHTML = '<tr><td colspan="7" class="empty">No OTPs generated yet — request one from the main site (register / login / withdrawal / password reset) or use the test button.</td></tr>';
  } else {
    const now = Date.now();
    body.innerHTML = list.map(o => {
      const expired = !o.used && !o.locked && o.expiresAt <= now;
      const status = o.used ? 'used' : o.locked ? 'locked' : expired ? 'expired' : 'active';
      const left = Math.max(0, Math.round((o.expiresAt - now) / 1000));
      const attempts = (o.attempts || 0) + '/' + (getOtpPolicy().maxAttempts);
      return `
      <tr>
        <td style="font-family:'JetBrains Mono';font-weight:700;color:var(--text-hi);" data-label="Code">${esc(o.code)}</td>
        <td data-label="Purpose">${esc(o.purpose || '—')}</td>
        <td data-label="Destination">${esc(o.dest || '—')}</td>
        <td data-label="Created" style="font-family:'JetBrains Mono';font-size:11.5px;color:var(--text-mid);">${new Date(o.createdAt).toLocaleTimeString('en-KE', {hour:'2-digit',minute:'2-digit',second:'2-digit'})}</td>
        <td data-label="Expires" style="font-family:'JetBrains Mono';font-size:11.5px;color:var(--text-mid);">${expired ? '—' : left + 's'}</td>
        <td data-label="Attempts" style="font-family:'JetBrains Mono';font-size:11.5px;color:var(--text-mid);">${o.used ? '—' : attempts}</td>
        <td data-label="Status"><span class="status-badge ${status === 'active' ? 'live' : status === 'used' ? 'crashed' : 'pending'}">${status}</span></td>
      </tr>`;
    }).join('');
  }
  renderSmsMetrics();
}

      createdAt: Date.now(),
      expiresAt: Date.now() + pol.expirySec * 1000,
      cooldownUntil: Date.now() + pol.cooldownSec * 1000,
      used: false, locked: false, attempts: 0,
    });
    otpInboxStore(list);
    logAudit('system', 'Admin requested a test OTP (<b>' + code + '</b>) — demo');
    showToast('📲 Test OTP: ' + code + ' — expires in ' + Math.round(pol.expirySec / 60) + ' min');
    renderOtpInbox();
  });
}

function renderNotifs(){
  const drop = document.getElementById('bellDrop');
  const unread = demoNotifications.filter(n => !n.read).length;
  const badge = document.getElementById('bellBadge');
  if(badge){
    badge.textContent = unread > 9 ? '9+' : unread;
    badge.style.display = unread ? 'flex' : 'none';
  }
  const items = demoNotifications.length
    ? demoNotifications.map(n => `
        <div class="notif-item ${n.read ? 'read' : 'unread'}" data-nid="${n.id}">
          <div class="notif-ico ${esc(n.cat)}">${notifIco(n.cat)}</div>
          <div class="notif-main">
            <div class="notif-title">${esc(n.title)}</div>
            <div class="notif-text">${esc(n.text)}</div>
            <div class="notif-time">${esc(n.time)}</div>
          </div>
        </div>`).join('')
    : '<div class="bell-empty"><span class="big">✨</span>You\'re all caught up.<br>New notifications will appear here.</div>';
  drop.innerHTML = `
    <div class="bell-head">
      <div class="title">Notifications <span class="count">${unread} new</span></div>
      <button class="mark-read" id="markAllRead">Mark all read</button>
    </div>
    <div class="bell-body" id="bellBody">${items}</div>
    <div class="bell-foot">${SIM_MODE ? 'Demo notifications — live feed arrives with the backend' : 'Live feed'}</div>`;
  const body = document.getElementById('bellBody');
  if(body){
    body.querySelectorAll('.notif-item').forEach(item => {
      item.addEventListener('click', () => {
        const n = demoNotifications.find(x => x.id === parseInt(item.dataset.nid, 10));
        if(n) n.read = true;
        renderNotifs();
      });
    });
  }
  const ma = document.getElementById('markAllRead');
  if(ma) ma.addEventListener('click', (e) => {
    e.stopPropagation();
    demoNotifications.forEach(n => { n.read = true; });
    renderNotifs();
    showToast('All notifications marked as read');
  });
}

function bindTopbar(){
  const bell = document.getElementById('bellBtn');
  const drop = document.getElementById('bellDrop');
  bell.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = drop.classList.toggle('open');
    bell.setAttribute('aria-expanded', open ? 'true' : 'false');
    if(open) renderNotifs();
  });
  document.addEventListener('click', (e) => {
    if(drop && !drop.contains(e.target)) drop.classList.remove('open');
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') drop.classList.remove('open');
  });
  renderNotifs(); // initial badge state

  // 1s ticker: keeps live-odds monitor, dashboard strip and OTP inbox fresh
  setInterval(() => {
    if(currentView === 'live') renderLive();
    else if(currentView === 'dashboard') updateOddsStrip();
    else if(currentView === 'otp') renderOtpInbox();
  }, 1000);

  document.getElementById('healthPill').addEventListener('dblclick', () => {
    showToast('Health check: all simulated services nominal (demo)');
  });

  document.getElementById('botsPill').addEventListener('click', () => setBots(!botsOn()));

  document.getElementById('exportBtn').addEventListener('click', () => {
    const rows = demoWithdrawals.map(w => [w.id, w.name, w.amt, w.method, w.risk, w.status].join(',')).join('\n');
    const blob = new Blob(['BetCrash admin export — DEMO DATA (no backend connected)\n' + rows], { type:'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'betcrash-withdrawals-demo.csv';
    a.click();
    URL.revokeObjectURL(a.href);
    showToast('Demo CSV exported — clearly marked as sample data');
  });

  document.getElementById('globalSearch').addEventListener('input', () => {
    if(currentView === 'users') bindUsers();
    if(currentView === 'transactions') bindTransactions();
  });
  document.getElementById('logoutBtn').addEventListener('click', logout);
  document.getElementById('drawerLogout').addEventListener('click', logout);

  /* Role switching — both the sidebar select and the drawer select stay in sync */
  function onRoleChange(e){
    session.role = e.target.value;
    safeSet('betcrashAdminSession', JSON.stringify(session));
    const label = ROLES[session.role].label;
    document.getElementById('adminRole').textContent = label;
    document.getElementById('whoAmI').textContent = label;
    document.getElementById('drawerAdminRole').textContent = label;
    document.getElementById('roleSelect').value = session.role;
    document.getElementById('drawerRoleSelect').value = session.role;
    buildNav();
    go(ROLES[session.role].views.includes(currentView) ? currentView : 'dashboard');
    logAudit('security', `Admin viewed dashboard as <b>${label}</b> (RBAC demo)`);
    showToast(`Role switched to ${label} (RBAC demo)`);
  }
  document.getElementById('roleSelect').addEventListener('change', onRoleChange);
  document.getElementById('drawerRoleSelect').addEventListener('change', onRoleChange);

  /* Mobile drawer — hamburger on the left, slides in from the left */
  document.getElementById('hamburger').addEventListener('click', toggleDrawer);
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  document.getElementById('drawerScrim').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeDrawer(); });
}

async function fetchJson(url, options = {}, retry = true){
  const headers = { 'Content-Type':'application/json', ...(options.headers||{}) };
  if(session && session.token) headers.Authorization = 'Bearer ' + session.token;
  const res = await fetch(url, { ...options, headers });
  const data = await res.json().catch(()=>null);
  if(res.ok) return data;
  throw new Error(data?.message || data?.error || res.statusText || 'Request failed');
}
