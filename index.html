<style>
  :root{
  --void:#16123A; --panel:#2A236B; --panel-raised:#211B55; --panel-line:#39327E;
  --green:#38F29F; --green-dim:rgba(56,242,159,0.14);
  --yellow:#FFD24A; --yellow-dim:rgba(255,210,74,0.13);
  --red:#FF4D6D; --red-dim:rgba(255,77,109,0.14);
  --text-hi:#FFFFFF; --text-mid:#A8A4D6; --text-low:#706A9B;
}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(120% 140% at 15% -10%, #211B55 0%, var(--void) 55%);
    color:var(--text-hi);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  ::selection{background:var(--yellow);color:var(--void);}
  .panel:hover,.balance-card:hover,.bet-card:hover,.players:hover{box-shadow:0 8px 24px rgba(0,0,0,.25);transform:translateY(-1px);transition:transform .15s ease,box-shadow .15s ease;}
  input:focus,textarea:focus{outline:none;border-color:var(--green)!important;box-shadow:0 0 0 3px rgba(56,242,159,.18);}
  .btn:active{transform:scale(.97);transition:transform .12s ease;}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 22px;
    border-bottom:1px solid var(--panel-line);
    background:rgba(14,12,43,0.7);
    backdrop-filter:blur(6px);
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:10px;
    background:transparent;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .brand-mark img{width:34px;height:34px;object-fit:contain;}
  .brand-name{font-family:'Space Grotesk';font-weight:700;font-size:17px;letter-spacing:0.2px;}
  .brand-name span{color:var(--yellow);}
  .topbar-right{display:flex;align-items:center;gap:14px;}
  .wallet-pill{
    display:flex;align-items:center;gap:9px;
    background:var(--panel);border:1px solid var(--panel-line);
    padding:7px 8px 7px 14px;border-radius:99px;
  }
  .wallet-pill .label{font-size:10.5px;color:var(--text-mid);text-transform:uppercase;letter-spacing:0.08em;}
  .wallet-pill .amount{font-family:'JetBrains Mono';font-weight:700;font-size:14.5px;color:var(--green);}
  .wallet-pill button{
    background:var(--yellow);color:var(--void);border:none;border-radius:99px;
    padding:6px 14px;font-family:'Space Grotesk';font-weight:700;font-size:12.5px;cursor:pointer;
  }
  .account-btn{
    min-width:96px;
    height:36px;
    border-radius:99px;
    border:1px solid var(--panel-line);
    background:var(--panel-raised);
    color:var(--text-hi);
    font-family:'Space Grotesk';
    font-weight:700;
    font-size:12.5px;
    cursor:pointer;
    padding:0 14px;
  }
  .account-btn:hover{
    background:rgba(51,226,138,0.08);
    color:var(--green);
  }

  /* ---------- Layout ----------
  .layout{
    flex:1;display:grid;grid-template-columns:1fr 340px;gap:16px;
    padding:16px 22px 22px;max-width:1360px;margin:0 auto;width:100%;
  }
  @media (max-width:900px){ .layout{grid-template-columns:1fr;} }

  /* ---------- History strip ---------- */
  .history{
    display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;
    scrollbar-width:none;
  }
  .history::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;padding:5px 10px;border-radius:7px;
    font-family:'JetBrains Mono';font-size:12px;font-weight:700;
    border:1px solid var(--panel-line);
  }
  .chip.low{background:var(--panel);color:var(--text-mid);}
  .chip.mid{background:var(--green-dim);color:var(--green);border-color:rgba(51,226,138,0.3);}
  .chip.high{background:var(--yellow-dim);color:var(--yellow);border-color:rgba(255,210,63,0.35);}

  /* ---------- Stage ---------- */
  .stage{
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:16px;
    position:relative;
    overflow:hidden;
    height:480px;
    display:flex;flex-direction:column;
  }
  .stage-grid{position:absolute;inset:0;}
  .stage-center{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;pointer-events:none;
  }
  .status-tag{
    font-family:'Space Grotesk';font-weight:600;font-size:12.5px;
    letter-spacing:0.14em;text-transform:uppercase;color:var(--text-mid);
    display:flex;align-items:center;gap:8px;
  }
  .status-dot{width:7px;height:7px;border-radius:50%;background:var(--text-low);}
  .status-tag.live .status-dot{background:var(--green);box-shadow:0 0 8px var(--green);}
  .status-tag.crashed .status-dot{background:var(--red);box-shadow:0 0 8px var(--red);}

  .multiplier{
    font-family:'Space Grotesk';font-weight:700;
    font-size:76px;line-height:1;letter-spacing:-0.01em;
    color:var(--text-hi);
    transition:color .15s ease;
  }
  .multiplier.live{color:var(--green);text-shadow:0 0 26px rgba(51,226,138,0.45);}
  .multiplier.crashed{color:var(--red);text-shadow:0 0 26px rgba(255,92,108,0.45);}
  .sub-msg{font-family:'JetBrains Mono';font-size:13px;color:var(--text-mid);min-height:18px;}

  .countdown-ring{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  }

  .stage-footer{
    position:relative;z-index:2;margin-top:auto;
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px;border-top:1px solid var(--panel-line);
    font-family:'JetBrains Mono';font-size:11.5px;color:var(--text-low);
  }
  .stage-footer .fair{display:flex;align-items:center;gap:6px;}
  .fair-dot{width:6px;height:6px;border-radius:50%;background:var(--green);}

  /* ---------- Bet panel ---------- */
  .betpanel{display:flex;flex-direction:column;gap:12px;}
  .bet-tabs{
    display:flex;background:var(--panel);border:1px solid var(--panel-line);
    border-radius:10px;padding:3px;
  }
  .bet-tabs button{
    flex:1;padding:8px;border:none;background:transparent;color:var(--text-mid);
    font-family:'Space Grotesk';font-weight:600;font-size:12.5px;border-radius:8px;cursor:pointer;
  }
  .bet-tabs button.active{background:var(--panel-raised);color:var(--text-hi);}

  .bet-card{
    background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;
    padding:16px;display:flex;flex-direction:column;gap:12px;
  }
  .field-label{
    font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;
    color:var(--text-mid);margin-bottom:6px;display:block;
  }
  .amount-row{display:flex;align-items:center;background:var(--void);border:1px solid var(--panel-line);border-radius:9px;overflow:hidden;}
  .amount-row input{
    flex:1;background:transparent;border:none;color:var(--text-hi);
    font-family:'JetBrains Mono';font-weight:700;font-size:16px;padding:10px 12px;outline:none;width:0;
  }
  .amount-row .step{background:var(--panel-raised);border:none;color:var(--text-mid);width:34px;cursor:pointer;font-size:15px;align-self:stretch;}
  .quick-amts{display:flex;gap:6px;}
  .quick-amts button{
    flex:1;background:var(--panel-raised);border:1px solid var(--panel-line);color:var(--text-mid);
    border-radius:7px;padding:6px 0;font-family:'JetBrains Mono';font-size:11.5px;cursor:pointer;
  }
  .quick-amts button:hover{color:var(--text-hi);border-color:var(--green);}

  .auto-row{display:flex;align-items:center;justify-content:space-between;}
  .switch{
    width:36px;height:20px;border-radius:99px;background:var(--panel-raised);
    position:relative;cursor:pointer;border:1px solid var(--panel-line);
  }
  .switch.on{background:var(--green-dim);border-color:var(--green);}
  .switch .knob{
    position:absolute;top:1px;left:1px;width:16px;height:16px;border-radius:50%;
    background:var(--text-low);transition:transform .15s ease, background .15s ease;
  }
  .switch.on .knob{transform:translateX(16px);background:var(--green);}

  .bet-cta{
    padding:14px;border:none;border-radius:10px;
    font-family:'Space Grotesk';font-weight:700;font-size:15px;cursor:pointer;
    background:var(--green);color:#062616;letter-spacing:0.01em;
    display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  .bet-cta small{font-family:'JetBrains Mono';font-weight:500;font-size:11px;opacity:0.75;}
  .bet-cta.placed{background:var(--yellow);color:#3B2900;}
  .bet-cta.cash{background:var(--yellow);color:#3B2900;}
  .bet-cta:disabled{background:var(--panel-raised);color:var(--text-low);cursor:not-allowed;}

  .players{
    background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;
    padding:14px 16px;flex:1;min-height:120px;display:flex;flex-direction:column;
  }
  .players-head{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;
    font-family:'Space Grotesk';font-weight:600;font-size:12.5px;color:var(--text-mid);
    text-transform:uppercase;letter-spacing:0.08em;
  }
  .players-head span{color:var(--green);}
  .player-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:7px 0;border-bottom:1px solid var(--panel-line);
    font-family:'JetBrains Mono';font-size:12.5px;
  }
  .player-row:last-child{border-bottom:none;}
  .player-row .name{color:var(--text-mid);}
  .player-row .stake{color:var(--text-hi);}
  .player-row .mult{color:var(--text-low);}
  .player-row.won .mult{color:var(--green);}
  .player-row.won .stake{color:var(--green);}
</style>
</head>
<body>
<div id="app-loader" style="position:fixed;inset:0;z-index:9999;background:#16123A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;opacity:1;transition:opacity .4s ease,visibility .4s ease;">
  <div style="width:72px;height:72px;animation:neo-pulse 1.2s ease-in-out infinite;">
    <img src="/favicon/favicon.svg" alt="" width="72" height="72">
  </div>
  <div style="font-family:'Space Grotesk';font-weight:700;font-size:22px;letter-spacing:.04em;">
    <span style="color:#FFFFFF;">Bet</span><span style="color:#FFD24A;">Crash</span>
  </div>
</div>
<style>
@keyframes neo-pulse{0%,100%{filter:drop-shadow(0 0 6px rgba(56,242,159,.3));transform:scale(1);}50%{filter:drop-shadow(0 0 16px rgba(56,242,159,.6));transform:scale(1.05);}}
</style>
<script>window.addEventListener('load',()=>{const l=document.getElementById('app-loader');if(l){setTimeout(()=>{l.style.opacity='0';setTimeout(()=>l.remove(),500)},700);}});</script>


<div class="topbar">
  <div class="brand">
    <div class="brand-mark"><img src="/favicon/favicon.svg" alt="BetCrash" width="34" height="34"></div>
    <div class="brand-name">Bet<span>Crash</span></div>
  </div>
  <div class="topbar-right">
    <div class="wallet-pill">
      <div>
        <div class="label">Balance</div>
        <div class="amount" id="walletAmt">KES 12,450</div>
      </div>
      <button>Deposit</button>
    </div>
    <button class="account-btn" id="accountBtn">Account</button>
  </div>
</div>

<div class="layout">
  <div class="stage-col">
    <div class="history" id="history"></div>

    <div class="stage">
      <svg class="stage-grid" id="graphSvg" viewBox="0 0 800 480" preserveAspectRatio="none"></svg>
      <div class="stage-center">
        <div class="status-tag live" id="statusTag"><span class="status-dot"></span><span id="statusText">Round in progress</span></div>
        <div class="multiplier live" id="multiplierText">1.00x</div>
        <div class="sub-msg" id="subMsg">Cash out before it crashes</div>
      </div>
      <div class="stage-footer">
        <div class="fair"><span class="fair-dot"></span>Provably fair · round #<span id="roundId">10482</span></div>
        <div id="playersLive">18 players in this round</div>
      </div>
    </div>
  </div>

  <div class="betpanel">
    <div class="bet-tabs">
      <button class="active" id="tabManual">Manual</button>
      <button id="tabAuto">Auto</button>
    </div>

    <div class="bet-card">
      <div>
        <label class="field-label">Bet amount</label>
        <div class="amount-row">
          <button class="step" id="amtDown">−</button>
          <input id="amtInput" value="200" inputmode="numeric">
          <button class="step" id="amtUp">+</button>
        </div>
      </div>
      <div class="quick-amts">
        <button data-v="100">100</button>
        <button data-v="200">200</button>
        <button data-v="500">500</button>
        <button data-v="1000">1,000</button>
      </div>

      <div class="auto-row">
        <label class="field-label" style="margin:0;">Auto cash out at</label>
        <div class="switch" id="autoSwitch"><div class="knob"></div></div>
      </div>
      <div class="amount-row" id="autoRow" style="display:none;">
        <input id="autoInput" value="2.00" inputmode="decimal">
        <span style="padding-right:12px;color:var(--text-mid);font-family:'JetBrains Mono';">x</span>
      </div>

      <button class="bet-cta" id="betBtn">
        Place bet
        <small id="betCtaSub">KES 200 · next round</small>
      </button>
    </div>

    <div class="players">
      <div class="players-head">In this round <span id="playersCount">18</span></div>
      <div id="playersList"></div>
    </div>
  </div>
</div>

<script>
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('graphSvg');
const multEl=document.getElementById('multiplierText');
const statusTag=document.getElementById('statusTag');
const statusText=document.getElementById('statusText');
const subMsg=document.getElementById('subMsg');
const historyEl=document.getElementById('history');
const roundIdEl=document.getElementById('roundId');
const betBtn=document.getElementById('betBtn');
const betCtaSub=document.getElementById('betCtaSub');
const amtInput=document.getElementById('amtInput');
const autoSwitch=document.getElementById('autoSwitch');
const autoRow=document.getElementById('autoRow');
const autoInput=document.getElementById('autoInput');
const walletAmt=document.getElementById('walletAmt');
const playersListEl=document.getElementById('playersList');
const playersCountEl=document.getElementById('playersCount');
const playersLiveEl=document.getElementById('playersLive');

let wallet=12450;
let roundId=10482;
let history=[1.24,3.81,1.02,7.4,2.15,1.9,14.2,1.11,2.6,4.05];
let autoOn=false;
let betPlaced=false;
let cashedOut=false;
let betAmount=200;
let phase='waiting'; // waiting | flying | crashed
let startTime=0, crashPoint=0, waitStart=0;
const WAIT_MS=4500;
let path=[]; // {t, m}
let botPlayers=[];

function fmtMoney(n){ return 'KES ' + Math.round(n).toLocaleString(); }

function renderHistory(){
  historyEl.innerHTML='';
  history.slice(-14).reverse().forEach(v=>{
    const c=document.createElement('div');
    c.className='chip ' + (v>=10?'high': v>=2?'mid':'low');
    c.textContent=v.toFixed(2)+'x';
    historyEl.appendChild(c);
  });
}
renderHistory();

function makeBots(n){
  const names=['J.Otieno','A.Wanjiru','K.Njoroge','M.Achieng','P.Mutua','S.Kamau','L.Chebet','D.Odhiambo','R.Wafula','G.Auma','B.Kiprop','F.Nduta'];
  botPlayers=Array.from({length:n},()=>({
    name:names[Math.floor(Math.random()*names.length)],
    stake:[50,100,200,300,500,1000][Math.floor(Math.random()*6)],
    cashAt: (1.2+Math.random()*8),
    resolved:false,
    won:false
  }));
}

function renderPlayers(currentMult){
  playersListEl.innerHTML='';
  botPlayers.slice(0,7).forEach(p=>{
    if(phase==='flying' && !p.resolved && currentMult>=p.cashAt){ p.resolved=true; p.won=true; }
    if(phase==='crashed' && !p.resolved){ p.resolved=true; p.won=false; }
    const row=document.createElement('div');
    row.className='player-row'+(p.won?' won':'');
    const stakeTxt = p.won ? '+'+fmtMoney(p.stake*p.cashAt-p.stake) : fmtMoney(p.stake);
    const multTxt = p.resolved ? (p.won? p.cashAt.toFixed(2)+'x' : '—') : '…';
    row.innerHTML = '<span class="name">'+p.name+'</span><span class="mult">'+multTxt+'</span><span class="stake">'+stakeTxt+'</span>';
    playersListEl.appendChild(row);
  });
  playersCountEl.textContent=botPlayers.length;
  playersLiveEl.textContent=botPlayers.length+' players in this round';
}

function drawGrid(){
  let s='';
  for(let x=0;x<=800;x+=80){ s+=`<line x1="${x}" y1="0" x2="${x}" y2="480" stroke="#2C2870" stroke-width="1" opacity="0.5"/>`; }
  for(let y=0;y<=480;y+=60){ s+=`<line x1="0" y1="${y}" x2="800" y2="${y}" stroke="#2C2870" stroke-width="1" opacity="0.5"/>`; }
  return s;
}

function multToY(m){
  const norm = Math.log(m)/Math.log(30);
  return 460 - Math.min(norm,1)*400;
}

function drawPath(){
  const gridSvg=drawGrid();
  let d='';
  path.forEach((p,i)=>{
    const x = Math.min(p.t/1000*130, 780);
    const y = multToY(p.m);
    d += (i===0?'M':'L') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
  });
  const lastX = path.length ? Math.min(path[path.length-1].t/1000*130,780) : 0;
  const lastY = path.length ? multToY(path[path.length-1].m) : 460;
  const color = phase==='crashed' ? '#FF5C6C' : '#33E28A';
  const glow = phase==='crashed' ? 'rgba(255,92,108,0.18)' : 'rgba(51,226,138,0.18)';
  let fillD = d + `L${lastX.toFixed(1)} 480 L0 480 Z`;
  svg.innerHTML = gridSvg +
    `<path d="${fillD}" fill="${glow}"/>` +
    `<path d="${d}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round"/>` +
    (phase!=='waiting' ? `<circle cx="${lastX}" cy="${lastY}" r="6" fill="${color}"/>` : '');
}

function setBetCtaState(){
  if(phase==='waiting' && !betPlaced){
    betBtn.className='bet-cta';
    betBtn.querySelector('small').textContent = fmtMoney(betAmount) + ' · next round';
    betBtn.firstChild.textContent = 'Place bet ';
    betBtn.disabled=false;
  } else if(phase==='waiting' && betPlaced){
    betBtn.className='bet-cta placed';
    betBtn.querySelector('small').textContent='Waiting for round to start';
    betBtn.firstChild.textContent = 'Bet placed ';
    betBtn.disabled=true;
  } else if(phase==='flying' && betPlaced && !cashedOut){
    betBtn.className='bet-cta cash';
    betBtn.disabled=false;
    betBtn.firstChild.textContent='Cash out ';
  } else if(phase==='flying' && (!betPlaced || cashedOut)){
    betBtn.className='bet-cta';
    betBtn.disabled=true;
    betBtn.firstChild.textContent = cashedOut ? 'Cashed out ' : 'Round in progress ';
    betBtn.querySelector('small').textContent = cashedOut ? 'Nice — wait for next round' : 'Betting closed';
  } else if(phase==='crashed'){
    betBtn.className='bet-cta';
    betBtn.disabled=true;
    betBtn.firstChild.textContent='Round crashed ';
    betBtn.querySelector('small').textContent='Next round starting soon';
  }
}

function cashOut(currentMult){
  if(!betPlaced||cashedOut) return;
  cashedOut=true;
  const win = betAmount*currentMult;
  wallet += win;
  walletAmt.textContent=fmtMoney(wallet);
  subMsg.textContent = 'Cashed out at '+currentMult.toFixed(2)+'x · +'+fmtMoney(win-betAmount);
  setBetCtaState();
}

betBtn.addEventListener('click', ()=>{
  if(phase==='waiting' && !betPlaced){
    if(betAmount>wallet){ subMsg.textContent='Insufficient balance'; return; }
    betPlaced=true;
    wallet-=betAmount;
    walletAmt.textContent=fmtMoney(wallet);
    setBetCtaState();
  } else if(phase==='flying' && betPlaced && !cashedOut){
    const elapsed=(performance.now()-startTime);
    const currentMult = Math.exp(elapsed*0.00022);
    cashOut(Math.min(currentMult, crashPoint));
  }
});

document.getElementById('amtUp').onclick=()=>{ betAmount+=50; amtInput.value=betAmount; setBetCtaState(); };
document.getElementById('amtDown').onclick=()=>{ betAmount=Math.max(50,betAmount-50); amtInput.value=betAmount; setBetCtaState(); };
amtInput.addEventListener('change',()=>{ betAmount=Math.max(50, parseInt(amtInput.value)||200); amtInput.value=betAmount; setBetCtaState(); });
document.querySelectorAll('.quick-amts button').forEach(b=>{
  b.addEventListener('click',()=>{ betAmount=parseInt(b.dataset.v); amtInput.value=betAmount; setBetCtaState(); });
});
autoSwitch.addEventListener('click',()=>{
  autoOn=!autoOn;
  autoSwitch.classList.toggle('on',autoOn);
  autoRow.style.display=autoOn?'flex':'none';
});

const accountBtn = document.getElementById('accountBtn');
if(accountBtn){
  accountBtn.addEventListener('click', ()=>{
    window.location.href = '/onboarding';
  });
}

function newRound(){
  roundId++;
  roundIdEl.textContent=roundId;
  phase='waiting';
  betPlaced=false; cashedOut=false;
  crashPoint = generateCrashPoint();
  path=[{t:0,m:1}];
  makeBots(14+Math.floor(Math.random()*10));
  multEl.className='multiplier';
  multEl.textContent='1.00x';
  statusTag.className='status-tag';
  statusText.textContent='Starting in';
  subMsg.textContent='Place your bet before lift-off';
  drawPath();
  renderPlayers(1);
  setBetCtaState();
  waitStart=performance.now();
  requestAnimationFrame(waitLoop);
}

function generateCrashPoint(){
  const r = Math.random();
  const val = 0.97/(1-r);
  return Math.max(1.0, Math.min(val, 60));
}

function waitLoop(now){
  if(phase!=='waiting') return;
  const remaining = Math.max(0, WAIT_MS-(now-waitStart));
  statusText.textContent = 'Starting in ' + (remaining/1000).toFixed(1) + 's';
  if(remaining<=0){
    phase='flying';
    startTime=performance.now();
    statusTag.classList.add('live');
    statusText.textContent='Round in progress';
    multEl.classList.add('live');
    subMsg.textContent='Cash out before it crashes';
    setBetCtaState();
    requestAnimationFrame(flyLoop);
    return;
  }
  requestAnimationFrame(waitLoop);
}

function flyLoop(now){
  if(phase!=='flying') return;
  const elapsed = now-startTime;
  const currentMult = Math.exp(elapsed*0.00022);

  if(currentMult>=crashPoint){
    const finalM=crashPoint;
    path.push({t:elapsed,m:finalM});
    multEl.textContent=finalM.toFixed(2)+'x';
    multEl.className='multiplier crashed';
    statusTag.className='status-tag crashed';
    statusText.textContent='Crashed';
    subMsg.textContent = betPlaced && !cashedOut ? 'You lost this round' : (cashedOut? subMsg.textContent : 'Better luck next round');
    phase='crashed';
    drawPath();
    renderPlayers(finalM);
    history.push(finalM);
    renderHistory();
    setBetCtaState();
    setTimeout(newRound, 2200);
    return;
  }

  path.push({t:elapsed,m:currentMult});
  if(path.length>400) path.shift();
  multEl.textContent=currentMult.toFixed(2)+'x';
  drawPath();
  renderPlayers(currentMult);

  if(autoOn && betPlaced && !cashedOut){
    const target=parseFloat(autoInput.value)||2;
    if(currentMult>=target){ cashOut(target); }
  }

  requestAnimationFrame(flyLoop);
}

newRound();
</script>
