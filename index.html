<style>
/* ═══════════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════════ */
:root {
  --void:     #16123A;
  --panel:    #2A236B;
  --panel-raised: #211B55;
  --panel-line:   #39327E;
  --green:    #38F29F;
  --green-dim:rgba(56,242,159,0.14);
  --yellow:   #FFD24A;
  --yellow-dim:rgba(255,210,74,0.13);
  --red:      #FF4D6D;
  --red-dim:  rgba(255,77,109,0.14);
  --text-hi:  #FFFFFF;
  --text-mid: #A8A4D6;
  --text-low: #706A9B;
  /* Fluid type */
  --mult-size: clamp(40px, 6vw + 1rem, 88px);
  --btn-size:  clamp(13px, 1vw + 0.5rem, 16px);
  --body-size: clamp(13px, 0.9vw + 0.4rem, 16px);
}
</style>
<style>
/* ═══════════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: radial-gradient(120% 140% at 15% -10%, #211B55 0%, var(--void) 55%);
  color: var(--text-hi);
  font-family: 'Inter', sans-serif;
  font-size: var(--body-size);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}
::selection { background: var(--yellow); color: var(--void); }

/* ═══════════════════════════════════════════════
   APP LOADER
═══════════════════════════════════════════════ */
#app-loader {
  position: fixed; inset: 0; z-index: 9999;
  background: #16123A;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
  opacity: 1; transition: opacity .4s ease;
}
@keyframes neo-pulse {
  0%,100% { filter: drop-shadow(0 0 6px rgba(56,242,159,.3)); transform: scale(1); }
  50%      { filter: drop-shadow(0 0 18px rgba(56,242,159,.65)); transform: scale(1.06); }
}

/* ═══════════════════════════════════════════════
   TOP BAR
═══════════════════════════════════════════════ */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 22px;
  border-bottom: 1px solid var(--panel-line);
  background: rgba(14,12,43,0.75);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  position: sticky; top: 0; z-index: 20;
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 10px;
  background: transparent; display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.brand-mark img { width: 34px; height: 34px; object-fit: contain; }
.brand-name { font-family: 'Space Grotesk'; font-weight: 700; font-size: 17px; letter-spacing: .2px; }
.brand-name span { color: var(--yellow); }
.topbar-right { display: flex; align-items: center; gap: 10px; }
</style>
<style>
/* ── Auth-aware topbar widgets ── */
/* Guest: shown when not logged in */
.nav-guest { display: flex; align-items: center; gap: 8px; }
.nav-auth  { display: none; align-items: center; gap: 10px; }
body.is-authed .nav-guest { display: none; }
body.is-authed .nav-auth  { display: flex; }

/* Wallet pill (auth only) */
.wallet-pill {
  display: flex; align-items: center; gap: 9px;
  background: var(--panel); border: 1px solid var(--panel-line);
  padding: 6px 8px 6px 14px; border-radius: 99px;
  transition: box-shadow .2s;
}
.wallet-pill:hover { box-shadow: 0 0 0 2px rgba(56,242,159,.22); }
.wallet-pill .label { font-size: 10px; color: var(--text-mid); text-transform: uppercase; letter-spacing: .08em; }
.wallet-pill .amount {
  font-family: 'JetBrains Mono'; font-weight: 700; font-size: 14px; color: var(--green);
  min-width: 80px;
}
/* skeleton shimmer */
.skel {
  background: linear-gradient(90deg, var(--panel-raised) 25%, var(--panel-line) 50%, var(--panel-raised) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  border-radius: 6px;
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* Deposit btn */
.btn-deposit {
  background: var(--yellow); color: var(--void);
  border: none; border-radius: 99px;
  padding: 7px 16px;
  font-family: 'Space Grotesk'; font-weight: 700; font-size: 12.5px;
  cursor: pointer;
  transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
}
.btn-deposit:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(255,210,74,.35); }
.btn-deposit:active { transform: scale(.96); }
.btn-deposit:focus-visible { outline: 2px solid var(--yellow); outline-offset: 3px; }

/* Login / Register nav buttons */
.btn-nav-login {
  padding: 7px 16px; border-radius: 99px;
  border: 1px solid var(--panel-line); background: transparent;
  color: var(--text-mid); font-family: 'Space Grotesk'; font-weight: 600; font-size: 13px;
  cursor: pointer; transition: color .15s, border-color .15s;
}
.btn-nav-login:hover { color: var(--text-hi); border-color: var(--green); }
.btn-nav-login:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }

.btn-nav-register {
  padding: 7px 18px; border-radius: 99px;
  border: none; background: var(--green); color: #062616;
  font-family: 'Space Grotesk'; font-weight: 700; font-size: 13px;
  cursor: pointer; transition: transform .15s, box-shadow .15s;
}
.btn-nav-register:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(56,242,159,.3); }
.btn-nav-register:active { transform: scale(.96); }
.btn-nav-register:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }

/* Account menu button */
.account-btn {
  height: 36px; border-radius: 99px;
  border: 1px solid var(--panel-line); background: var(--panel-raised);
  color: var(--text-hi); font-family: 'Space Grotesk'; font-weight: 700; font-size: 13px;
  cursor: pointer; padding: 0 16px;
  transition: background .15s, color .15s, box-shadow .15s;
}
.account-btn:hover { background: rgba(56,242,159,.09); color: var(--green); }
.account-btn:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
</style>
<style>
/* ═══════════════════════════════════════════════
   HISTORY STRIP — horizontally scrollable carousel
═══════════════════════════════════════════════ */
.history-wrap {
  position: sticky; top: 57px; z-index: 15;
  background: rgba(14,12,43,0.65);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--panel-line);
  padding: 0 22px;
}
.history {
  display: flex; gap: 6px;
  overflow-x: auto; overflow-y: hidden;
  padding: 8px 0;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.history::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto;
  padding: 5px 11px; border-radius: 8px;
  font-family: 'JetBrains Mono'; font-size: 12px; font-weight: 700;
  border: 1px solid var(--panel-line);
  cursor: default; user-select: none;
  transition: transform .12s ease, box-shadow .12s ease;
}
.chip:hover { transform: translateY(-2px); }
.chip.low  { background: var(--panel); color: var(--text-mid); }
.chip.mid  { background: var(--green-dim); color: var(--green); border-color: rgba(56,242,159,.3); }
.chip.high {
  background: var(--yellow-dim); color: var(--yellow);
  border-color: rgba(255,210,63,.45);
  box-shadow: 0 0 10px rgba(255,210,63,.18);
}
/* >10x gold glow */
.chip.mega {
  background: rgba(255,210,74,.15); color: var(--yellow);
  border: 1.5px solid var(--yellow);
  box-shadow: 0 0 12px rgba(255,210,74,.38), inset 0 0 8px rgba(255,210,74,.08);
  animation: goldPulse 2.4s ease-in-out infinite;
}
@keyframes goldPulse {
  0%,100% { box-shadow: 0 0 10px rgba(255,210,74,.35); }
  50%      { box-shadow: 0 0 20px rgba(255,210,74,.6); }
}

/* ═══════════════════════════════════════════════
   MAIN LAYOUT  (70/30 split)
═══════════════════════════════════════════════ */
.layout {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 320px;
  grid-template-rows: 1fr;
  gap: 16px;
  padding: 16px 22px 28px;
  max-width: 1440px;
  margin: 0 auto;
  width: 100%;
  /* Fill remaining viewport height below topbar + history strip */
  min-height: calc(100vh - 110px);
}
/* At ≥1440px bump sidebar */
@media (min-width: 1440px) { .layout { grid-template-columns: 1fr 340px; } }
/* Tablet: single column */
@media (max-width: 1023px) { .layout { grid-template-columns: 1fr; min-height: auto; } }
/* Mobile */
@media (max-width: 479px)  { .layout { padding: 12px 12px 20px; gap: 12px; } }

/* Stage col fills the grid row */
.layout > section {
  display: flex;
  flex-direction: column;
  min-height: 0;
}

/* ═══════════════════════════════════════════════
   STAGE (game canvas area)
═══════════════════════════════════════════════ */
.stage {
  background: var(--panel);
  border: 1px solid var(--panel-line);
  border-radius: 18px;
  position: relative;
  overflow: hidden;
  /* Grow to fill whatever height the section column has */
  flex: 1;
  min-height: 380px;
  transition: box-shadow .25s ease;
}
.stage:hover { box-shadow: 0 12px 40px rgba(0,0,0,.3); }
@media (max-width: 767px)  { .stage { min-height: 300px; } }
@media (max-width: 479px)  { .stage { min-height: 240px; border-radius: 14px; } }

/* Grid SVG */
.stage-grid { position: absolute; inset: 0; width: 100%; height: 100%; }

/* Plane */
#plane {
  position: absolute;
  width: 52px; height: 52px;
  pointer-events: none;
  z-index: 5;
  transform-origin: center center;
  transition: opacity .3s ease;
  filter: drop-shadow(0 0 8px rgba(56,242,159,.7));
}
@media (max-width: 479px) { #plane { width: 36px; height: 36px; } }

/* Neon trail canvas */
#trailCanvas {
  position: absolute; inset: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 4;
}

/* Center overlay */
.stage-center {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px; pointer-events: none; z-index: 6;
}
.status-tag {
  font-family: 'Space Grotesk'; font-weight: 600; font-size: 12px;
  letter-spacing: .14em; text-transform: uppercase; color: var(--text-mid);
  display: flex; align-items: center; gap: 8px;
}
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-low); }
.status-tag.live .status-dot  { background: var(--green); box-shadow: 0 0 8px var(--green); animation: blink 1.1s ease-in-out infinite; }
.status-tag.crashed .status-dot { background: var(--red); box-shadow: 0 0 8px var(--red); }
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.35;} }

.multiplier {
  font-family: 'Space Grotesk'; font-weight: 700;
  font-size: var(--mult-size);
  line-height: 1; letter-spacing: -.01em;
  transition: color .15s ease, text-shadow .15s ease;
}
.multiplier.live    { color: var(--green); text-shadow: 0 0 32px rgba(56,242,159,.5); }
.multiplier.crashed { color: var(--red);   text-shadow: 0 0 32px rgba(255,77,109,.5); }
.sub-msg { font-family: 'JetBrains Mono'; font-size: 13px; color: var(--text-mid); min-height: 18px; }

/* Screen shake on crash */
@keyframes crashShake {
  0%,100%{transform:translate(0,0);}
  20%{transform:translate(-4px, 3px);}
  40%{transform:translate(4px,-3px);}
  60%{transform:translate(-3px, 2px);}
  80%{transform:translate(3px,-2px);}
}
.stage.shake { animation: crashShake .35s ease; }

/* Stage footer */
.stage-footer {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 7;
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px;
  border-top: 1px solid var(--panel-line);
  background: rgba(22,18,58,.55);
  backdrop-filter: blur(4px);
  font-family: 'JetBrains Mono'; font-size: 11px; color: var(--text-low);
}
.fair { display: flex; align-items: center; gap: 6px; }
.fair-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
</style>
<style>
/* ═══════════════════════════════════════════════
   BET PANEL  (compact, tabbed)
═══════════════════════════════════════════════ */
.betpanel {
  display: flex; flex-direction: column; gap: 12px;
  /* Fill the grid row alongside the stage */
  min-height: 0;
  align-self: stretch;
}

/* Tab bar with animated sliding indicator */
.bet-tabs {
  position: relative;
  display: flex;
  background: var(--panel); border: 1px solid var(--panel-line);
  border-radius: 12px; padding: 3px;
  overflow: hidden;
}
.bet-tabs .tab-indicator {
  position: absolute; top: 3px; bottom: 3px;
  border-radius: 9px; background: var(--panel-raised);
  transition: left .25s cubic-bezier(.4,0,.2,1), width .25s cubic-bezier(.4,0,.2,1);
  z-index: 0;
}
.bet-tabs button {
  flex: 1; padding: 8px; border: none; background: transparent;
  color: var(--text-mid); font-family: 'Space Grotesk'; font-weight: 600;
  font-size: var(--btn-size); border-radius: 9px; cursor: pointer;
  position: relative; z-index: 1;
  transition: color .2s;
}
.bet-tabs button.active { color: var(--text-hi); }
.bet-tabs button:focus-visible { outline: 2px solid var(--green); outline-offset: -2px; }

/* Panel cards */
.bet-card {
  background: var(--panel); border: 1px solid var(--panel-line);
  border-radius: 16px;
  padding: 14px 18px;                /* ~35-40% shorter than before */
  display: flex; flex-direction: column; gap: 10px;
  transition: box-shadow .2s, transform .15s;
}
.bet-card:hover { box-shadow: 0 6px 22px rgba(0,0,0,.22); transform: translateY(-1px); }

.field-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--text-mid); margin-bottom: 5px; display: block; font-weight: 600;
}
.amount-row {
  display: flex; align-items: center;
  background: var(--void); border: 1px solid var(--panel-line); border-radius: 9px; overflow: hidden;
  transition: border-color .2s, box-shadow .2s;
}
.amount-row:focus-within { border-color: var(--green); box-shadow: 0 0 0 3px rgba(56,242,159,.16); }
.amount-row input {
  flex: 1; background: transparent; border: none; color: var(--text-hi);
  font-family: 'JetBrains Mono'; font-weight: 700; font-size: 15px;
  padding: 9px 10px; outline: none; width: 0;
}
.amount-row .step {
  background: var(--panel-raised); border: none; color: var(--text-mid);
  width: 32px; cursor: pointer; font-size: 15px; align-self: stretch;
  transition: background .15s, color .15s;
}
.amount-row .step:hover { background: var(--panel-line); color: var(--text-hi); }
.amount-row .step:active { transform: scale(.9); }
.amount-row .step:focus-visible { outline: 2px solid var(--green); outline-offset: -2px; }

.quick-amts { display: flex; gap: 6px; }
.quick-amts button {
  flex: 1; background: var(--panel-raised); border: 1px solid var(--panel-line);
  color: var(--text-mid); border-radius: 7px; padding: 5px 0;
  font-family: 'JetBrains Mono'; font-size: 11px; cursor: pointer;
  transition: color .15s, border-color .15s, transform .12s;
}
.quick-amts button:hover { color: var(--text-hi); border-color: var(--green); transform: translateY(-1px); }
.quick-amts button:active { transform: scale(.95); }
.quick-amts button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

.auto-row { display: flex; align-items: center; justify-content: space-between; }
.switch {
  width: 36px; height: 20px; border-radius: 99px;
  background: var(--panel-raised); position: relative; cursor: pointer;
  border: 1px solid var(--panel-line);
  transition: background .2s, border-color .2s;
}
.switch.on { background: var(--green-dim); border-color: var(--green); }
.switch .knob {
  position: absolute; top: 1px; left: 1px;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--text-low); transition: transform .18s ease, background .18s ease;
}
.switch.on .knob { transform: translateX(16px); background: var(--green); }
.switch:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }

/* CTA button — all states */
.bet-cta {
  width: 100%; padding: 12px 18px; border: none; border-radius: 10px;
  font-family: 'Space Grotesk'; font-weight: 700; font-size: var(--btn-size);
  cursor: pointer; background: var(--green); color: #062616;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  position: relative; overflow: hidden;
  transition: transform .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease;
}
.bet-cta small { font-family: 'JetBrains Mono'; font-weight: 500; font-size: 10.5px; opacity: .75; }
.bet-cta:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(56,242,159,.3); }
.bet-cta:active:not(:disabled) { transform: scale(.97); }
.bet-cta:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
.bet-cta.placed   { background: var(--panel-raised); color: var(--text-mid); cursor: default; }
.bet-cta.cash     { background: var(--yellow); color: #3B2900; box-shadow: 0 0 20px rgba(255,210,74,.3); }
.bet-cta.cash:hover:not(:disabled) { box-shadow: 0 6px 20px rgba(255,210,74,.45); }
.bet-cta:disabled { background: var(--panel-raised); color: var(--text-low); cursor: not-allowed; box-shadow: none; transform: none; }
/* Ripple */
.ripple { position:absolute; border-radius:50%; background:rgba(255,255,255,.2); transform:scale(0); animation:rippleAnim .55s linear; pointer-events:none; }
@keyframes rippleAnim { to { transform:scale(4); opacity:0; } }
/* Loading spinner */
.bet-cta.loading::after {
  content:''; position:absolute; inset:0;
  background:inherit; border-radius:inherit;
  display:flex; align-items:center; justify-content:center;
}

/* Auto tab content */
#autoPanel { display: none; flex-direction: column; gap: 10px; }
#autoPanel.visible { display: flex; }
</style>
<style>
/* ═══════════════════════════════════════════════
   PLAYERS LIST  (skeleton + rows)
═══════════════════════════════════════════════ */
.players {
  background: var(--panel); border: 1px solid var(--panel-line); border-radius: 16px;
  padding: 13px 16px; display: flex; flex-direction: column;
  flex: 1;                /* fill remaining sidebar height */
  min-height: 120px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--panel-line) transparent;
  transition: box-shadow .2s, transform .15s;
}
.players:hover { box-shadow: 0 6px 22px rgba(0,0,0,.22); transform: translateY(-1px); }
.players-head {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
  font-family: 'Space Grotesk'; font-weight: 600; font-size: 12px; color: var(--text-mid);
  text-transform: uppercase; letter-spacing: .08em;
}
.players-head span { color: var(--green); }
.player-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 0; border-bottom: 1px solid var(--panel-line);
  font-family: 'JetBrains Mono'; font-size: 12px;
  transition: background .12s;
}
.player-row:last-child { border-bottom: none; }
.player-row .name  { color: var(--text-mid); }
.player-row .stake { color: var(--text-hi); }
.player-row .mult  { color: var(--text-low); }
.player-row.won .mult  { color: var(--green); }
.player-row.won .stake { color: var(--green); }
/* skeleton rows */
.skel-row { display:flex; gap:8px; padding:6px 0; border-bottom:1px solid var(--panel-line); }
.skel-row:last-child { border-bottom:none; }

/* ═══════════════════════════════════════════════
   TOAST NOTIFICATION
═══════════════════════════════════════════════ */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--panel-raised); border: 1px solid var(--green);
  color: var(--text-hi); padding: 11px 20px; border-radius: 10px;
  font-size: 13px; font-family: 'Space Grotesk'; font-weight: 600;
  opacity: 0; transition: all .25s ease;
  display: flex; align-items: center; gap: 8px; z-index: 50;

<script>
/* ═══════════════════════════════════════════════
   AUTH STATE  (mirrors onboarding / wallet)
═══════════════════════════════════════════════ */
(function () {
  // Convert network-level fetch failures into a friendly, logged error
  var _fetch = window.fetch.bind(window);
  window.fetch = function (url, opts) {
    return _fetch(url, opts).catch(function (err) {
      console.error('[BetCrash] request to', String(url), 'failed:', err);
      var e = new Error('Unable to connect to the server. The service may be temporarily unavailable — check your connection and try again.');
      e.originalError = err;
      throw e;
    });
  };
})();
const API_BASE = (function () {
  var m = document.querySelector('meta[name="betcrash-api-url"]');
  if (m && m.content && m.content.trim()) return m.content.trim();
  if (window.BETCRASH_API_URL) return window.BETCRASH_API_URL;
  if (['localhost', '127.0.0.1', '::1'].indexOf(location.hostname) >= 0) return 'http://localhost:3333';
  return '';
})();
function getToken()   { return localStorage.getItem('betcrashAccessToken'); }
function getRefresh() { return localStorage.getItem('betcrashRefreshToken'); }
function saveTokens(a, r) {
  localStorage.setItem('betcrashAccessToken', a);
  if(r) localStorage.setItem('betcrashRefreshToken', r);
}

let isAuthed = false;
let authUser  = null;

async function checkAuth() {
  const token = getToken();
  if(!token) { setGuestUI(); return; }
  try {
    const me = await apiFetch('/auth/me');
    authUser  = me;
    isAuthed  = true;
    setAuthedUI(me);
    await loadWalletBalance();
  } catch(_) {
    setGuestUI();
  }
}

async function apiFetch(path, opts = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      ...(getToken() ? { Authorization: `Bearer ${getToken()}` } : {}),
      ...(opts.headers || {}),
    },
  });
  if(res.status === 401) {
    const r = getRefresh();
    if(r) {
      const ref = await fetch(`${API_BASE}/auth/refresh`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ refreshToken: r }),
      });
      if(ref.ok) {
        const d = await ref.json();
        saveTokens(d.accessToken, d.refreshToken);
        return apiFetch(path, opts);
      }
    }
    throw new Error('Unauthenticated');
  }
  if(!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.message || res.statusText); }
  return res.json().catch(() => null);
}

function setGuestUI() {
  document.body.classList.remove('is-authed');
}
function setAuthedUI(user) {
  document.body.classList.add('is-authed');
}

/* ── Count-up animation for wallet balance ── */
function animateCount(el, from, to, duration = 900) {
  const start = performance.now();
  function step(now) {
    const p = Math.min((now - start) / duration, 1);
    const ease = 1 - Math.pow(1 - p, 3);
    const val = from + (to - from) * ease;
    el.textContent = fmtMoney(val);
    if(p < 1) requestAnimationFrame(step);
    else el.textContent = fmtMoney(to);
  }
  requestAnimationFrame(step);
}

async function loadWalletBalance() {
  const amtEl = document.getElementById('walletAmt');
  // Show skeleton
  amtEl.innerHTML = '<span class="skel" style="display:inline-block;width:80px;height:14px;"></span>';
  try {
    const bal = await apiFetch('/wallet/balance');
    const amount = parseFloat(bal.balance) || 0;
    wallet = amount;
    amtEl.textContent = fmtMoney(wallet);
    animateCount(amtEl, 0, amount);
  } catch(_) {
    // Fall back to demo value
    wallet = 12450;
    amtEl.textContent = fmtMoney(wallet);
    animateCount(amtEl, 0, wallet);
  }
}

<script>
/* ═══════════════════════════════════════════════
   GAME ENGINE
═══════════════════════════════════════════════ */
const svg        = document.getElementById('graphSvg');
const multEl     = document.getElementById('multiplierText');
const statusTag  = document.getElementById('statusTag');
const statusText = document.getElementById('statusText');
const subMsg     = document.getElementById('subMsg');
const historyEl  = document.getElementById('history');
const roundIdEl  = document.getElementById('roundId');
const betBtn     = document.getElementById('betBtn');
const betCtaSub  = document.getElementById('betCtaSub');
const amtInput   = document.getElementById('amtInput');
const autoSwitch = document.getElementById('autoSwitch');
const autoTargetRow = document.getElementById('autoTargetRow');
const autoInput  = document.getElementById('autoInput');
const walletAmtEl = document.getElementById('walletAmt');
const playersListEl  = document.getElementById('playersList');
const playersCountEl = document.getElementById('playersCount');
const playersLiveEl  = document.getElementById('playersLive');
const stageEl    = document.getElementById('stage');
const planeEl    = document.getElementById('plane');
const trailCanvas   = document.getElementById('trailCanvas');
const particleCanvas = document.getElementById('particleCanvas');

let wallet = 12450;
let roundId = 10482;
let history = [1.24, 3.81, 1.02, 7.4, 2.15, 1.9, 14.2, 1.11, 2.6, 4.05];
let autoOn = false;
let betPlaced = false;
let cashedOut = false;
let betAmount = 200;
let phase = 'waiting'; // waiting | flying | crashed
let startTime = 0, crashPoint = 0, waitStart = 0;
const WAIT_MS = 4500;
let path = [];
let botPlayers = [];

// Plane position tracking
let planeX = 0, planeY = 0;

function fmtMoney(n) { return 'KES ' + Math.round(n).toLocaleString(); }

/* ── History strip ── */
function renderHistory() {
  historyEl.innerHTML = '';
  history.slice(-18).reverse().forEach(v => {
    const c = document.createElement('div');
    const cls = v >= 10 ? 'mega' : v >= 5 ? 'high' : v >= 2 ? 'mid' : 'low';
    c.className = 'chip ' + cls;
    c.textContent = v.toFixed(2) + 'x';
    c.setAttribute('role','listitem');
    c.setAttribute('aria-label', v.toFixed(2) + ' times');
    historyEl.appendChild(c);
  });
  // auto-scroll left so latest is visible
  historyEl.scrollLeft = 0;
}
renderHistory();

/* ── Bot players ── */
const ALL_NAMES = [
  'J.Otieno','A.Wanjiru','K.Njoroge','M.Achieng','P.Mutua','S.Kamau',
  'L.Chebet','D.Odhiambo','R.Wafula','G.Auma','B.Kiprop','F.Nduta',
  'C.Mwenda','T.Karanja','E.Kimani','N.Owino','I.Barasa','V.Maina',
  'H.Rotich','Z.Omondi','W.Githae','Q.Simiyu','U.Chepkwony','X.Njenga'
];

function makeBots(n) {
  // Shuffle names so every round has a different lineup
  const shuffled = [...ALL_NAMES].sort(() => Math.random() - 0.5);
  botPlayers = Array.from({ length: n }, (_, i) => ({
    name:     shuffled[i % shuffled.length],
    stake:    [50, 100, 100, 200, 200, 300, 500, 500, 1000][Math.floor(Math.random() * 9)],
    cashAt:   parseFloat((1.1 + Math.random() * 9).toFixed(2)),
    resolved: false,
    won:      false,
  }));
}

function renderPlayersSkeletons() {
  playersListEl.innerHTML = [0,1,2,3,4].map(() =>
    `<div class="skel-row">
      <span class="skel" style="width:70px;height:12px;border-radius:4px;"></span>
      <span class="skel" style="width:40px;height:12px;border-radius:4px;margin-left:auto;"></span>
      <span class="skel" style="width:55px;height:12px;border-radius:4px;margin-left:12px;"></span>
    </div>`).join('');
}

function renderPlayers(currentMult) {
  playersListEl.innerHTML = '';
  // Show up to 12 players to fill the sidebar
  botPlayers.slice(0, 12).forEach(p => {
    if(phase === 'flying'  && !p.resolved && currentMult >= p.cashAt) { p.resolved = true; p.won = true; }
    if(phase === 'crashed' && !p.resolved) { p.resolved = true; p.won = false; }
    const row = document.createElement('div');
    row.className = 'player-row' + (p.won ? ' won' : '');
    const stakeTxt = p.won ? '+' + fmtMoney(p.stake * p.cashAt - p.stake) : fmtMoney(p.stake);
    let multTxt;
    if(p.resolved) {
      multTxt = p.won ? p.cashAt.toFixed(2) + 'x' : '—';
    } else if(phase === 'waiting') {
      // Show predicted cash-out target while waiting
      multTxt = '<span style="color:var(--text-low);font-size:10px;">@' + p.cashAt.toFixed(2) + 'x</span>';
    } else {
      multTxt = '…';
    }
    row.innerHTML = `<span class="name">${p.name}</span><span class="mult">${multTxt}</span><span class="stake">${stakeTxt}</span>`;
    playersListEl.appendChild(row);
  });
  playersCountEl.textContent = botPlayers.length;
  playersLiveEl.textContent  = botPlayers.length + ' players';
}

/* ── Graph drawing ── */
function stageW() { return stageEl.clientWidth || 800; }
function stageH() { return stageEl.clientHeight || 460; }

function multToY(m) {
  const norm = Math.log(m) / Math.log(30);
  return stageH() - 44 - Math.min(norm, 1) * (stageH() - 90);
}
function multToX(elapsed) {
  return Math.min(elapsed / 1000 * (stageW() * 0.16), stageW() - 30);
}

function drawGrid() {
  const w = stageW(), h = stageH();
  let s = '';
  for(let x = 0; x <= w; x += w / 10) {
    s += `<line x1="${x.toFixed(1)}" y1="0" x2="${x.toFixed(1)}" y2="${h}" stroke="#2C2870" stroke-width="1" opacity="0.5"/>`;
  }
  for(let y = 0; y <= h; y += h / 8) {
    s += `<line x1="0" y1="${y.toFixed(1)}" x2="${w}" y2="${y.toFixed(1)}" stroke="#2C2870" stroke-width="1" opacity="0.5"/>`;
  }
  return s;
}

function drawPath() {
  const w = stageW(), h = stageH();
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  const gridSvg = drawGrid();
  if(!path.length) { svg.innerHTML = gridSvg; return; }
  let d = '';
  path.forEach((p, i) => {
    const x = multToX(p.t);
    const y = multToY(p.m);
    d += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
  });
  const lastP = path[path.length - 1];
  const lx = multToX(lastP.t), ly = multToY(lastP.m);
  const color = phase === 'crashed' ? '#FF5C6C' : '#33E28A';
  const glow  = phase === 'crashed' ? 'rgba(255,92,108,0.15)' : 'rgba(51,226,138,0.15)';
  const fillD = d + `L${lx.toFixed(1)} ${h} L0 ${h} Z`;
  const lineW = phase === 'waiting' ? '1.5' : '3';
  svg.innerHTML = gridSvg
    + `<path d="${fillD}" fill="${glow}"/>`
    + `<path d="${d}" fill="none" stroke="${color}" stroke-width="${lineW}" stroke-linecap="round" stroke-linejoin="round"/>`
    + (phase !== 'waiting' ? `<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="5" fill="${color}" filter="url(#glow)"/>` : '');
  planeX = lx; planeY = ly;
  updatePlane(lx, ly);
}

function updatePlane(x, y) {
  if(phase === 'crashed') { planeEl.style.opacity = '0'; return; }
  planeEl.style.opacity = '1';
  // offset so plane sits at tip of line
  const pw = planeEl.offsetWidth, ph = planeEl.offsetHeight;
  planeEl.style.left = (x - pw / 2) + 'px';
  planeEl.style.top  = (y - ph / 2) + 'px';
  // tilt: angle based on recent path delta
  if(path.length >= 2) {
    const prev = path[path.length - 2];
    const cur  = path[path.length - 1];
    const dx = multToX(cur.t)  - multToX(prev.t);
    const dy = multToY(cur.m)  - multToY(prev.m);
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
    planeEl.style.transform = `rotate(${Math.max(-50, Math.min(15, angle))}deg)`;
  }
}
</script>

<script>
/* ═══════════════════════════════════════════════
   CRASH PARTICLES
═══════════════════════════════════════════════ */
let particles = [];
function spawnParticles(x, y) {
  const ctx = particleCanvas.getContext('2d');
  particleCanvas.width  = stageW();
  particleCanvas.height = stageH();
  for(let i = 0; i < 60; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.5 + Math.random() * 4;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      r: 2 + Math.random() * 4,
      color: Math.random() > .5 ? '#FF4D6D' : '#FFD24A',
    });
  }
  animateParticles();
}
function animateParticles() {
  const ctx = particleCanvas.getContext('2d');
  ctx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
  let alive = false;
  particles.forEach(p => {
    p.x   += p.vx;
    p.y   += p.vy;
    p.vy  += 0.12; // gravity
    p.life -= 0.025;
    if(p.life <= 0) return;
    alive = true;
    ctx.globalAlpha = p.life;
    ctx.fillStyle   = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fill();
  });
  particles = particles.filter(p => p.life > 0);
  if(alive) requestAnimationFrame(animateParticles);
  else ctx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
}

/* ═══════════════════════════════════════════════
   BET BUTTON STATES
═══════════════════════════════════════════════ */
function setBetCtaState() {
  const sub  = betBtn.querySelector('small') || betCtaSub;
  if(phase === 'waiting' && !betPlaced) {
    betBtn.className = 'bet-cta';
    betBtn.disabled  = false;
    betBtn.childNodes[0].textContent = 'Place bet ';
    sub.textContent  = fmtMoney(betAmount) + ' · next round';
    betBtn.setAttribute('aria-label', 'Place bet of ' + fmtMoney(betAmount));
  } else if(phase === 'waiting' && betPlaced) {
    betBtn.className = 'bet-cta placed';
    betBtn.disabled  = true;
    betBtn.childNodes[0].textContent = 'Bet placed ✓ ';
    sub.textContent  = 'Waiting for round to start';
    betBtn.setAttribute('aria-label', 'Bet placed, waiting for round');
  } else if(phase === 'flying' && betPlaced && !cashedOut) {
    betBtn.className = 'bet-cta cash';
    betBtn.disabled  = false;
    const m = parseFloat(multEl.textContent);
    betBtn.childNodes[0].textContent = 'Cash out ';
    sub.textContent  = '@ ' + (m || '…') + ' = ' + fmtMoney(betAmount * (m || 1));
    betBtn.setAttribute('aria-label', 'Cash out now');
  } else if(phase === 'flying' && (!betPlaced || cashedOut)) {
    betBtn.className = 'bet-cta';
    betBtn.disabled  = true;
    betBtn.childNodes[0].textContent = cashedOut ? 'Cashed out ✓ ' : 'Round live ';
    sub.textContent  = cashedOut ? 'Nice — next round soon' : 'Betting closed';
  } else if(phase === 'crashed') {
    betBtn.className = 'bet-cta';
    betBtn.disabled  = true;
    betBtn.childNodes[0].textContent = 'Crashed ';
    sub.textContent  = 'Next round starting…';
  }
}

/* Ripple effect */
function addRipple(btn, e) {
  const rect  = btn.getBoundingClientRect();
  const size  = Math.max(rect.width, rect.height);
  const x = (e.clientX || rect.left + rect.width / 2)  - rect.left - size / 2;
  const y = (e.clientY || rect.top  + rect.height / 2) - rect.top  - size / 2;
  const rip = document.createElement('span');
  rip.className = 'ripple';
  rip.style.cssText = `width:${size}px;height:${size}px;left:${x}px;top:${y}px;`;
  btn.appendChild(rip);
  setTimeout(() => rip.remove(), 600);
}

/* Cash-out logic */
function cashOut(currentMult) {
  if(!betPlaced || cashedOut) return;
  cashedOut = true;
  const win = betAmount * currentMult;
  wallet += win;
  updateWalletDisplay();
  subMsg.textContent = '✓ Cashed out @ ' + currentMult.toFixed(2) + 'x · +' + fmtMoney(win - betAmount);
  setBetCtaState();
  showToast('Cashed out @ ' + currentMult.toFixed(2) + 'x · +' + fmtMoney(win - betAmount));
}

function updateWalletDisplay() {
  if(document.body.classList.contains('is-authed')) {
    walletAmtEl.textContent = fmtMoney(wallet);
  }
}

betBtn.addEventListener('click', e => {
  addRipple(betBtn, e);
  if(phase === 'waiting' && !betPlaced) {
    if(betAmount > wallet) { subMsg.textContent = '⚠ Insufficient balance'; return; }
    betPlaced = true;
    wallet -= betAmount;
    updateWalletDisplay();
    setBetCtaState();
  } else if(phase === 'flying' && betPlaced && !cashedOut) {
    const elapsed = performance.now() - startTime;
    const cur     = Math.exp(elapsed * 0.00022);
    cashOut(Math.min(cur, crashPoint));
  }
});

/* Amount controls */
document.getElementById('amtUp').onclick   = () => { betAmount += 50; amtInput.value = betAmount; setBetCtaState(); };
document.getElementById('amtDown').onclick = () => { betAmount = Math.max(50, betAmount - 50); amtInput.value = betAmount; setBetCtaState(); };
amtInput.addEventListener('change', () => { betAmount = Math.max(50, parseInt(amtInput.value) || 200); amtInput.value = betAmount; setBetCtaState(); });
document.querySelectorAll('.quick-amts button').forEach(b => {
  b.addEventListener('click', e => { addRipple(b, e); betAmount = parseInt(b.dataset.v); amtInput.value = betAmount; setBetCtaState(); });
});

/* Auto-bet amount controls */
let autoBetAmount = 200;
const autoAmtInput = document.getElementById('autoAmtInput');
document.getElementById('autoAmtUp').onclick   = () => { autoBetAmount += 50; autoAmtInput.value = autoBetAmount; };
document.getElementById('autoAmtDown').onclick = () => { autoBetAmount = Math.max(50, autoBetAmount - 50); autoAmtInput.value = autoBetAmount; };
document.querySelectorAll('[data-auto-v]').forEach(b => {
  b.addEventListener('click', e => { addRipple(b, e); autoBetAmount = parseInt(b.dataset.autoV); autoAmtInput.value = autoBetAmount; });
});

/* Auto cash-out switch */
autoSwitch.addEventListener('click', () => {
  autoOn = !autoOn;
  autoSwitch.classList.toggle('on', autoOn);
  autoSwitch.setAttribute('aria-checked', autoOn);
  autoTargetRow.style.display = autoOn ? 'flex' : 'none';
});
autoSwitch.addEventListener('keydown', e => { if(e.key === ' ' || e.key === 'Enter') { e.preventDefault(); autoSwitch.click(); } });

/* Nav buttons */
document.getElementById('loginBtn').addEventListener('click',    () => { window.location.href = '/onboarding'; });
document.getElementById('registerBtn').addEventListener('click', () => { window.location.href = '/onboarding'; });
document.getElementById('depositBtn').addEventListener('click',  () => { window.location.href = '/wallet'; });
document.getElementById('accountBtn').addEventListener('click',  () => { window.location.href = '/onboarding'; });
</script>

<script>
/* ═══════════════════════════════════════════════
   TAB SWITCHING (animated indicator)
═══════════════════════════════════════════════ */
const tabManual   = document.getElementById('tabManual');
const tabAuto     = document.getElementById('tabAuto');
const manualPanel = document.getElementById('manualPanel');
const autoPanelEl = document.getElementById('autoPanel');
const indicator   = document.getElementById('tabIndicator');

function positionIndicator(btn) {
  indicator.style.left  = btn.offsetLeft + 'px';
  indicator.style.width = btn.offsetWidth + 'px';
}
positionIndicator(tabManual);

tabManual.addEventListener('click', () => {
  tabManual.classList.add('active'); tabManual.setAttribute('aria-selected','true');
  tabAuto.classList.remove('active'); tabAuto.setAttribute('aria-selected','false');
  manualPanel.style.display = '';
  autoPanelEl.style.display = 'none';
  positionIndicator(tabManual);
});
tabAuto.addEventListener('click', () => {
  tabAuto.classList.add('active'); tabAuto.setAttribute('aria-selected','true');
  tabManual.classList.remove('active'); tabManual.setAttribute('aria-selected','false');
  autoPanelEl.style.display = '';
  manualPanel.style.display = 'none';
  positionIndicator(tabAuto);
});

/* ═══════════════════════════════════════════════
   GAME LOOP
═══════════════════════════════════════════════ */
function generateCrashPoint() {
  const r   = Math.random();
  const val = 0.97 / (1 - r);
  return Math.max(1.0, Math.min(val, 60));
}

function newRound() {
  roundId++;
  roundIdEl.textContent = roundId;
  phase     = 'waiting';
  betPlaced = false;
  cashedOut = false;
  crashPoint = generateCrashPoint();
  path = [{ t: 0, m: 1 }];
  makeBots(18 + Math.floor(Math.random() * 8));
  multEl.className    = 'multiplier';
  multEl.textContent  = '1.00x';
  statusTag.className = 'status-tag';
  statusText.textContent = 'Starting in';
  subMsg.textContent  = 'Place your bet before lift-off';
  planeEl.style.opacity = '0';
  drawPath();
  renderPlayersSkeletons();
  setTimeout(() => renderPlayers(1), 600);
  setBetCtaState();
  waitStart = performance.now();
  requestAnimationFrame(waitLoop);
}

function waitLoop(now) {
  if(phase !== 'waiting') return;
  const remaining = Math.max(0, WAIT_MS - (now - waitStart));
  statusText.textContent = 'Starting in ' + (remaining / 1000).toFixed(1) + 's';
  if(remaining <= 0) {
    phase       = 'flying';
    startTime   = performance.now();
    statusTag.className = 'status-tag live';
    statusText.textContent = 'Round in progress';
    multEl.classList.add('live');
    subMsg.textContent  = 'Cash out before it crashes!';
    planeEl.style.opacity = '1';
    setBetCtaState();
    requestAnimationFrame(flyLoop);
    return;
  }
  requestAnimationFrame(waitLoop);
}

function flyLoop(now) {
  if(phase !== 'flying') return;
  const elapsed     = now - startTime;
  const currentMult = Math.exp(elapsed * 0.00022);

  if(currentMult >= crashPoint) {
    // CRASH
    const finalM = crashPoint;
    path.push({ t: elapsed, m: finalM });
    multEl.textContent  = finalM.toFixed(2) + 'x';
    multEl.className    = 'multiplier crashed';
    statusTag.className = 'status-tag crashed';
    statusText.textContent = 'Crashed!';
    subMsg.textContent  = betPlaced && !cashedOut
      ? '✗ You lost this round'
      : (cashedOut ? subMsg.textContent : 'Better luck next round');
    phase = 'crashed';

    // Screen shake
    stageEl.classList.add('shake');
    setTimeout(() => stageEl.classList.remove('shake'), 380);

    // Particles at plane position
    spawnParticles(planeX, planeY);
    planeEl.style.opacity = '0';

    drawPath();
    renderPlayers(finalM);
    history.push(parseFloat(finalM.toFixed(2)));
    renderHistory();
    setBetCtaState();

    if(betPlaced && !cashedOut) showToast('Crashed at ' + finalM.toFixed(2) + 'x');

    setTimeout(newRound, 2600);
    return;
  }

  path.push({ t: elapsed, m: currentMult });
  if(path.length > 500) path.shift();
  multEl.textContent = currentMult.toFixed(2) + 'x';
  drawPath();
  renderPlayers(currentMult);

  // Update cashout sub-label in real time
  if(phase === 'flying' && betPlaced && !cashedOut) {
    betCtaSub.textContent = '@ ' + currentMult.toFixed(2) + 'x = ' + fmtMoney(betAmount * currentMult);
  }

  // Auto cash-out
  if(autoOn && betPlaced && !cashedOut) {
    const target = parseFloat(autoInput.value) || 2;
    if(currentMult >= target) cashOut(target);
  }

  requestAnimationFrame(flyLoop);
}

/* ═══════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════ */
function showToast(text) {
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = text;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3000);
}

/* ═══════════════════════════════════════════════
   APP LOADER DISMISS + BOOT
═══════════════════════════════════════════════ */
window.addEventListener('load', () => {
  const l = document.getElementById('app-loader');
  if(l) { setTimeout(() => { l.style.opacity = '0'; setTimeout(() => l.remove(), 500); }, 700); }
  checkAuth();      // auth-aware topbar
  newRound();       // start first game round
});

// Recalculate indicator on resize (tab may shift)
window.addEventListener('resize', () => {
  const active = document.querySelector('.bet-tabs button.active');
  if(active) positionIndicator(active);
  // Also redraw graph on resize
  if(path.length) drawPath();
});
</script>
</body>
</html>
