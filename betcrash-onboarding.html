<style>
  :root{
  --void:#16123A; --panel:#2A236B; --panel-raised:#211B55; --panel-line:#39327E;
  --green:#38F29F; --green-dim:rgba(56,242,159,0.14);
  --yellow:#FFD24A; --yellow-dim:rgba(255,210,74,0.13);
  --red:#FF4D6D; --red-dim:rgba(255,77,109,0.14);
  --text-hi:#FFFFFF; --text-mid:#A8A4D6; --text-low:#706A9B;
}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(120% 140% at 15% -10%, #211B55 0%, #16123A 55%);
    color:var(--text-hi);font-family:'Inter',sans-serif;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;padding:26px 16px 60px;
  }
  ::selection{background:var(--yellow);color:var(--void);}
  .panel:hover,.balance-card:hover,.bet-card:hover,.players:hover{box-shadow:0 8px 24px rgba(0,0,0,.25);transform:translateY(-1px);transition:transform .15s ease,box-shadow .15s ease;}
  input:focus,textarea:focus{outline:none;border-color:var(--green)!important;box-shadow:0 0 0 3px rgba(56,242,159,.18);}
  .btn:active{transform:scale(.97);transition:transform .12s ease;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
  .brand-mark{width:34px;height:34px;border-radius:10px;background:transparent;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .brand-mark img{width:34px;height:34px;object-fit:contain;}
  .brand-name{font-family:'Space Grotesk';font-weight:700;font-size:17px;}
  .brand-name span{color:var(--yellow);}

  /* stepper */
  .stepper{display:flex;align-items:center;gap:6px;margin-bottom:26px;max-width:460px;width:100%;}
  .step-dot{
    flex:1;height:4px;border-radius:99px;background:var(--panel-line);position:relative;overflow:hidden;
  }
  .step-dot .fill{position:absolute;inset:0;background:var(--green);width:0%;transition:width .4s ease;}
  .step-dot.done .fill{width:100%;}
  .step-dot.active .fill{width:55%;background:var(--yellow);}

  .card{
    width:100%;max-width:460px;background:var(--panel);border:1px solid var(--panel-line);
    border-radius:20px;padding:28px;box-shadow:0 28px 80px rgba(0,0,0,0.18);
  }
  .card h2{font-family:'Space Grotesk';font-size:22px;margin:0 0 8px;font-weight:700;}
  .card .desc{font-size:14px;color:var(--text-mid);margin-bottom:24px;line-height:1.6;}

  label{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-mid);font-weight:600;display:block;margin-bottom:8px;}
  .field{margin-bottom:16px;}
  input, select{
    width:100%;background:var(--void);border:1px solid var(--panel-line);border-radius:9px;
    padding:11px 12px;color:var(--text-hi);font-family:'Inter';font-size:14px;outline:none;
  }
  input:focus, select:focus{border-color:var(--green);}
  .hint{font-size:11px;color:var(--text-low);margin-top:5px;}
  .hint.err{color:var(--red);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .btn{
    width:100%;padding:14px 16px;border:none;border-radius:12px;font-family:'Space Grotesk';font-weight:700;
    font-size:15px;cursor:pointer;background:var(--green);color:#062616;margin-top:10px;transition:transform .2s ease,background .2s ease;
  }
  .btn:hover:not(:disabled){transform:translateY(-1px);}
  .btn:disabled{background:var(--panel-raised);color:var(--text-low);cursor:not-allowed;}
  .btn.secondary{background:transparent;border:1px solid var(--panel-line);color:var(--text-mid);margin-top:8px;}
  .link{color:var(--yellow);cursor:pointer;font-weight:600;}

  /* OTP */
  .otp-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .otp-row input{
    flex:1 1 44px;text-align:center;font-family:'JetBrains Mono';font-size:20px;font-weight:700;padding:14px 0;
    min-width:44px;border-radius:12px;
  }
  .resend{font-size:12.5px;color:var(--text-mid);margin-top:12px;text-align:center;}

  /* KYC upload */
  .upload-box{
    border:1.5px dashed var(--panel-line);border-radius:14px;padding:20px;text-align:center;
    margin-bottom:14px;cursor:pointer;transition:border-color .15s ease,background .2s ease;
    min-height:118px;display:flex;flex-direction:column;justify-content:center;
  }
  .upload-box:hover{border-color:var(--green);}
  .upload-box.filled{border-style:solid;border-color:var(--green);background:var(--green-dim);}
  .upload-box .icon{font-size:22px;margin-bottom:6px;}
  .upload-box .title{font-family:'Space Grotesk';font-weight:600;font-size:13px;}
  .upload-box .sub{font-size:11px;color:var(--text-low);margin-top:3px;}

  /* pending / status */
  .status-center{text-align:center;padding:10px 0 4px;}
  .status-icon{
    width:64px;height:64px;border-radius:50%;margin:0 auto 18px;
    display:flex;align-items:center;justify-content:center;font-size:26px;
  }
  .status-icon.pending{background:var(--yellow-dim);color:var(--yellow);}
  .status-icon.verified{background:var(--green-dim);color:var(--green);}
  .checklist{margin-top:20px;text-align:left;}
  .check-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--panel-line);font-size:13px;}
  .check-row:last-child{border-bottom:none;}
  .check-mark{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex:0 0 auto;}
  .check-mark.done{background:var(--green);color:#062616;}
  .check-mark.wait{background:var(--panel-raised);border:1px solid var(--panel-line);color:var(--text-low);}
  .check-row.wait{color:var(--text-mid);}

  .foot-note{font-size:11.5px;color:var(--text-low);text-align:center;margin-top:18px;line-height:1.6;}

  @media (max-width:680px) {
    body{padding:20px 14px 50px;}
    .brand{flex-direction:column;align-items:center;margin-bottom:20px;text-align:center;}
    .brand-name{font-size:18px;}
    .stepper{margin-bottom:18px;}
    .card{padding:22px;}
    .row2{grid-template-columns:1fr;}
    .field{margin-bottom:14px;}
    input, select{font-size:15px;padding:13px 12px;}
    .btn{font-size:15px;padding:14px 16px;}
    .upload-box{padding:18px;}
    .otp-row{gap:6px;}
    .otp-row input{flex:1 1 1ce;min-width:56px;font-size:18px;padding:12px 0;}
    .check-row{font-size:13px;}
  }
</style>
</head>

<div class="brand">
  <div class="brand-mark"><img src="/favicon/favicon.svg" alt="BetCrash" width="34" height="34"></div>
  <div class="brand-name">Bet<span>Crash</span></div>

<div class="stepper" id="stepper"></div>

<div class="card" id="card"></div>

<script>
(function () {
  // Convert network-level fetch failures into a friendly, logged error
  var _fetch = window.fetch.bind(window);
  window.fetch = function (url, opts) {
    return _fetch(url, opts).catch(function (err) {
      console.error('[BetCrash] request to', String(url), 'failed:', err);
      var e = new Error('Unable to connect to the server. The service may be temporarily unavailable — check your connection and try again.');
      e.originalError = err;
      throw e;
    });
  };
})();
const API_BASE = (function () {
  var m = document.querySelector('meta[name="betcrash-api-url"]');
  if (m && m.content && m.content.trim()) return m.content.trim();
  if (window.BETCRASH_API_URL) return window.BETCRASH_API_URL;
  if (['localhost', '127.0.0.1', '::1'].indexOf(location.hostname) >= 0) return 'http://localhost:3333';
  return '';
})();
const STEPS=['register','phone_otp','kyc','pending','verified'];
let stepIdx=0;
let userData={name:'',email:'',phone:'',password:'',dob:'',idNumber:'',idDoc:false,selfie:false};

// mock registry — in production this is a backend lookup against every verified account's ID number
const REGISTERED_ID_NUMBERS=['34567891','29981144','40112203'];

function getAuthToken(){
  return window.localStorage.getItem('betcrashAccessToken');
}

function getRefreshToken(){
  return window.localStorage.getItem('betcrashRefreshToken');
}

function setAuthTokens(auth){
  if(auth.accessToken){
    window.localStorage.setItem('betcrashAccessToken', auth.accessToken);
  }
  if(auth.refreshToken){
    window.localStorage.setItem('betcrashRefreshToken', auth.refreshToken);
  }
}

function authHeaders(){
  const token = getAuthToken();
  return token ? { Authorization: `Bearer ${token}` } : {};
}

async function refreshAuth(){
  const refreshToken = getRefreshToken();
  if(!refreshToken){
    throw new Error('Missing refresh token');
  }
  const data = await fetchJson(`${API_BASE}/auth/refresh`, {
    method: 'POST',
    body: JSON.stringify({ refreshToken }),
  }, false);
  setAuthTokens(data);
  return data;
}

async function fetchJson(url, options = {}, retry = true){
  const isJson = !options.headers || !options.headers['Content-Type'];
  const headers = {
    'Content-Type': isJson ? 'application/json' : undefined,
    ...authHeaders(),
    ...options.headers,
  };

  const res = await fetch(url, {
    ...options,
    headers,
  });

  const data = await res.json().catch(()=>null);
  if(res.ok){
    return data;
  }

  if(res.status === 401 && retry && !url.endsWith('/auth/refresh')){
    await refreshAuth();
    return fetchJson(url, options, false);
  }

  throw new Error(data?.message || data?.error || res.statusText || 'Request failed');
}

async function registerUser(payload){
  return fetchJson(`${API_BASE}/auth/register`, {
    method:'POST',
    body: JSON.stringify(payload),
  }, false);
}

async function getMe(){
  return fetchJson(`${API_BASE}/auth/me`, {
    method: 'GET',
    headers: authHeaders(),
  });
}

function setRegisterHint(message, isError=false){
  const hint=document.getElementById('rHint');
  if(!hint) return;
  hint.className=isError?'hint err':'hint';
  hint.textContent=message;
}

function renderStepper(){
  const el=document.getElementById('stepper');
  el.innerHTML='';
  const visibleSteps=4; // register, phone, kyc, review(pending/verified collapse)
  const progressIdx=Math.min(stepIdx,3);
  for(let i=0;i<visibleSteps;i++){
    const d=document.createElement('div');
    d.className='step-dot'+(i<progressIdx?' done':i===progressIdx?' active':'');
    d.innerHTML='<div class="fill"></div>';
    el.appendChild(d);
  }
}

function goTo(step){
  stepIdx=STEPS.indexOf(step);
  renderStepper();
  render();
}

function render(){
  const step=STEPS[stepIdx];
  const card=document.getElementById('card');
  if(step==='register') card.innerHTML=viewRegister();
  else if(step==='email_otp') card.innerHTML=viewOtp('email', userData.email);
  else if(step==='phone_otp') card.innerHTML=viewOtp('phone', userData.phone);
  else if(step==='kyc') card.innerHTML=viewKyc();
  else if(step==='pending') card.innerHTML=viewPending();
  else if(step==='verified') card.innerHTML=viewVerified();
  bindEvents(step);
}

function viewRegister(){
  return `
    <h2>Create your account</h2>
    <div class="desc">Takes about two minutes. We'll send a verification code to your phone next.</div>
    <div class="field"><label>Full name</label><input id="rName" placeholder="e.g. Grace Wanjiku" value="${userData.name}"></div>
    <div class="field"><label>Email address</label><input id="rEmail" type="email" placeholder="you@example.com" value="${userData.email}"></div>
    <div class="field"><label>Phone number</label><input id="rPhone" placeholder="07XX XXX XXX" value="${userData.phone}"></div>
    <div class="row2">
      <div class="field"><label>Password</label><input id="rPass" type="password" placeholder="Min. 8 characters"></div>
      <div class="field"><label>Confirm</label><input id="rPass2" type="password" placeholder="Repeat password"></div>
    </div>
    <div class="hint" id="rHint">You must be 18 or older to register.</div>
    <button class="btn" id="rBtn">Continue</button>
    <div class="foot-note">By continuing you agree to our Terms & the Responsible Gambling policy.</div>
  `;
}

function viewOtp(kind, dest){
  const label = kind==='email' ? 'Verify your email' : 'Verify your phone';
  const desc = kind==='email'
    ? `We sent a 6-digit code to <b style="color:var(--text-hi)">${dest||'your email'}</b>.`
    : `We sent a 6-digit SMS code to <b style="color:var(--text-hi)">${dest||'your phone'}</b>.`;
  return `
    <h2>${label}</h2>
    <div class="desc">${desc}</div>
    <div class="otp-row">
      ${[0,1,2,3,4,5].map(i=>`<input maxlength="1" inputmode="numeric" class="otpDigit" data-i="${i}">`).join('')}
    </div>
    <div class="hint" id="otpHint">Enter the 6-digit code — try <b style="color:var(--text-mid)">482913</b> (demo).</div>
    <button class="btn" id="otpBtn" disabled>Verify code</button>
    <div class="resend">Didn't get it? <span class="link" id="resendLink">Resend code</span></div>
  `;
}

function viewKyc(){
  return `
    <h2>Verify your identity</h2>
    <div class="desc">Required by Kenyan gaming regulations before you can deposit or withdraw.</div>
    <div class="field"><label>Date of birth</label><input id="kDob" type="date"></div>
    <div class="hint" id="dobHint"></div>
    <div class="field"><label>National ID / Passport number</label><input id="kIdNum" placeholder="e.g. 34567891" inputmode="numeric"></div>
    <div class="hint" id="idNumHint">One account per ID number — this is checked automatically.</div>
    <div class="upload-box" id="boxId">
      <div class="icon">🪪</div>
      <div class="title">Upload National ID or Passport</div>
      <div class="sub">Clear photo, all corners visible · JPG or PNG</div>
    </div>
    <div class="upload-box" id="boxSelfie">
      <div class="icon">🤳</div>
      <div class="title">Take a quick selfie</div>
      <div class="sub">Used to match your face to your ID</div>
    </div>
    <button class="btn" id="kycBtn" disabled>Submit for verification</button>
  `;
}

function viewPending(){
  return `
    <div class="status-center">
      <div class="status-icon pending">⏳</div>
      <h2>Verification in progress</h2>
      <div class="desc">Our compliance team is reviewing your documents. This usually takes a few minutes, occasionally up to 24 hours.</div>
    </div>
    <div class="checklist">
      <div class="check-row"><div class="check-mark done">✓</div>Account created</div>
      <div class="check-row"><div class="check-mark done">✓</div>Phone verified via OTP</div>
      <div class="check-row"><div class="check-mark done">✓</div>Documents submitted</div>
      <div class="check-row wait"><div class="check-mark wait">…</div>Admin review <span id="reviewState" style="margin-left:auto;color:var(--text-low);">pending</span></div>
    </div>
    <div class="foot-note">You can browse the platform now, but deposits and withdrawals unlock once you're verified.</div>
  `;
}

function viewVerified(){
  return `
    <div class="status-center">
      <div class="status-icon verified">✓</div>
      <h2>You're verified</h2>
      <div class="desc">Your identity was approved by our compliance team. You're all set to deposit and start playing.</div>
    </div>
    <button class="btn">Go to wallet</button>
    <div class="foot-note">Play responsibly — set a deposit limit any time from Account settings.</div>
  `;
}

function bindEvents(step){
  if(step==='register'){
    const check=()=>{
      const ok = document.getElementById('rName').value.trim() &&
                 document.getElementById('rEmail').value.includes('@') &&
                 document.getElementById('rPhone').value.trim().length>=9 &&
                 document.getElementById('rPass').value.length>=8 &&
                 document.getElementById('rPass').value===document.getElementById('rPass2').value;
      document.getElementById('rBtn').disabled=!ok;
    };
    ['rName','rEmail','rPhone','rPass','rPass2'].forEach(id=>document.getElementById(id).addEventListener('input',check));
    document.getElementById('rBtn').addEventListener('click',async()=>{
      userData.name=document.getElementById('rName').value;
      userData.email=document.getElementById('rEmail').value;
      userData.phone=document.getElementById('rPhone').value;
      userData.password=document.getElementById('rPass').value;
      setRegisterHint('Creating account...');
      document.getElementById('rBtn').disabled=true;
      try {
        const auth = await registerUser({
          name: userData.name,
          email: userData.email,
          phone: userData.phone,
          password: userData.password,
        });
        setAuthTokens(auth);

        await getMe();
        setRegisterHint('Account created, redirecting to OTP...');
        goTo('phone_otp');
      } catch (error) {
        setRegisterHint(error.message || 'Registration failed', true);
      } finally {
        document.getElementById('rBtn').disabled=false;
      }
    });
  }
  if(step==='email_otp' || step==='phone_otp'){
    const digits=[...document.querySelectorAll('.otpDigit')];
    digits[0].focus();
    digits.forEach((d,i)=>{
      d.addEventListener('input',()=>{
        d.value=d.value.replace(/[^0-9]/g,'');
        if(d.value && i<5) digits[i+1].focus();
        checkOtp();
      });
      d.addEventListener('keydown',(e)=>{
        if(e.key==='Backspace' && !d.value && i>0) digits[i-1].focus();
      });
    });
    function checkOtp(){
      const code=digits.map(d=>d.value).join('');
      const btn=document.getElementById('otpBtn');
      const hint=document.getElementById('otpHint');
      if(code.length===6){
        if(code==='482913'){
          btn.disabled=false;
          hint.className='hint';
          hint.innerHTML='Code confirmed.';
        } else {
          btn.disabled=true;
          hint.className='hint err';
          hint.innerHTML='Incorrect code — try 482913 (demo).';
        }
      } else {
        btn.disabled=true;
      }
    }
    document.getElementById('otpBtn').addEventListener('click',()=>{
      goTo('kyc');
    });
    document.getElementById('resendLink').addEventListener('click',(e)=>{
      e.target.textContent='Code resent ✓';
      setTimeout(()=>{ e.target.textContent='Resend code'; },1800);
    });
  }
  if(step==='kyc'){
    const dobInput=document.getElementById('kDob');
    const dobHint=document.getElementById('dobHint');
    const idNumInput=document.getElementById('kIdNum');
    const idNumHint=document.getElementById('idNumHint');
    const boxId=document.getElementById('boxId');
    const boxSelfie=document.getElementById('boxSelfie');
    const btn=document.getElementById('kycBtn');
    let idNumOk=false;
    function refresh(){
      let dobOk=false;
      if(dobInput.value){
        userData.dob = dobInput.value; // capture for API call
        const age=(new Date().getTime()-new Date(dobInput.value).getTime())/(365.25*24*3600*1000);
        if(age<18){ dobHint.className='hint err'; dobHint.textContent='You must be 18 or older to use BetCrash.'; }
        else { dobHint.className='hint'; dobHint.textContent='Age verified.'; dobOk=true; }
      }
      btn.disabled = !(dobOk && idNumOk && userData.idDoc && userData.selfie);
    }
    function checkIdNumber(){
      const raw=idNumInput.value.trim();
      userData.idNumber=raw;
      if(raw.length<6){
        idNumOk=false;
        idNumHint.className='hint';
        idNumHint.textContent='One account per ID number — this is checked automatically.';
      } else if(REGISTERED_ID_NUMBERS.includes(raw)){
        idNumOk=false;
        idNumHint.className='hint err';
        idNumHint.innerHTML='This ID is already linked to an existing account. Duplicate accounts aren\'t allowed — <span class="link" id="loginInstead">log in instead</span> or contact support if this is a mistake.';
        const li=document.getElementById('loginInstead');
        if(li) li.addEventListener('click', ()=>{ idNumHint.textContent='Redirecting to login…'; });
      } else {
        idNumOk=true;
        idNumHint.className='hint';
        idNumHint.textContent='ID number available — no existing account found.';
      }
      refresh();
    }
    dobInput.addEventListener('change',refresh);
    idNumInput.addEventListener('input',checkIdNumber);
    boxId.addEventListener('click',()=>{
      userData.idDoc=true;
      boxId.classList.add('filled');
      boxId.querySelector('.title').textContent='ID uploaded ✓';
      boxId.querySelector('.sub').textContent='national_id_front.jpg';
      refresh();
    });
    boxSelfie.addEventListener('click',()=>{
      userData.selfie=true;
      boxSelfie.classList.add('filled');
      boxSelfie.querySelector('.title').textContent='Selfie captured ✓';
      boxSelfie.querySelector('.sub').textContent='Liveness check passed';
      refresh();
    });
    btn.addEventListener('click', async ()=>{
      if(REGISTERED_ID_NUMBERS.includes(userData.idNumber)) return;
      btn.disabled = true;
      btn.textContent = 'Submitting…';
      try {
        await fetchJson(`${API_BASE}/kyc/submit`, {
          method: 'POST',
          body: JSON.stringify({
            idNumber:    userData.idNumber,
            dateOfBirth: userData.dob,
            idDocumentUrl: null,  // file upload handled separately in production
            selfieUrl:     null,
          }),
        });
        REGISTERED_ID_NUMBERS.push(userData.idNumber);
        goTo('pending');
        pollKycStatus();
      } catch(err) {
        btn.disabled = false;
        btn.textContent = 'Submit for verification';
        idNumHint.className = 'hint err';
        idNumHint.textContent = err.message || 'Submission failed — try again.';
      }
    });
  }
}

/** Poll GET /kyc/status every 5 s until approved/rejected */
function pollKycStatus(){
  const interval = setInterval(async ()=>{
    try {
      const data = await fetchJson(`${API_BASE}/kyc/status`);
      const stateEl = document.getElementById('reviewState');
      if(data.status === 'APPROVED'){
        clearInterval(interval);
        goTo('verified');
      } else if(data.status === 'REJECTED'){
        clearInterval(interval);
        if(stateEl){ stateEl.textContent='rejected'; stateEl.style.color='var(--red)'; }
      } else if(data.status === 'PENDING'){
        if(stateEl){ stateEl.textContent='in review'; stateEl.style.color='var(--yellow)'; }
      }
    } catch(_){}
  }, 5000);
}

renderStepper();
render();
</script>
